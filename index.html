<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17151b">
<title>Mis Pequeñas Misiones — 6.0+ Consolidada</title>
<style>
:root{
  --pink:#e65b91;--purple:#7652bd;--purple2:#9b73df;--green:#26a987;
  --yellow:#ffd84d;--ink:#403647;--muted:#7b7380;--line:#e9dfe9;
  --bg:#faf6fb;--white:#fff;--dark:#19171d;--shadow:0 14px 40px #34223b18;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--dark);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{width:min(760px,100%);min-height:100vh;margin:auto;background:linear-gradient(180deg,#fffafd,#f8f4fb);padding-bottom:94px;overflow:hidden}
.top{height:58px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 18px;font-weight:900;letter-spacing:.2px}
.head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:#fffafd;position:sticky;top:0;z-index:30;border-bottom:1px solid #eee5ef}
.brand{display:flex;align-items:center;gap:10px}.brandIcon{font-size:37px;filter:drop-shadow(0 5px 6px #0002)}
.brand b{display:block;font-size:21px}.brand small{color:var(--muted)}
.bell{border:0;background:#fff;border-radius:18px;padding:10px 12px;font-size:23px;box-shadow:0 4px 14px #00000010}
main{padding:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:27px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.hero{background:radial-gradient(circle at 85% 15%,#efe1ff 0 15%,transparent 16%),linear-gradient(135deg,#fff,#fff0f7)}
.profile{display:flex;gap:14px;align-items:center}.avatar{width:78px;height:78px;border-radius:25px;background:linear-gradient(145deg,#eee3ff,#fff);display:grid;place-items:center;font-size:48px;box-shadow:inset 0 2px 7px #fff,0 8px 18px #0001}
.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.sectionHead h2{margin:0}
.chips,.quick,.tabs{display:flex;gap:7px;flex-wrap:wrap}.chip,.pill{background:#eee6fb;border-radius:15px;padding:6px 10px;font-size:12px;font-weight:900}
.outline,.tab{border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 13px;font-weight:900;color:var(--ink)}
.tab.active{border:2px solid var(--pink);color:var(--pink);background:#fff1f7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:1px solid var(--line);background:#fff;border-radius:20px;padding:15px;text-align:left;min-height:105px;box-shadow:0 6px 16px #00000008}
.tile .ico{font-size:32px}.tile strong{display:block;margin-top:5px;font-size:16px}.tile small{color:var(--muted)}
.subjectGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.subject{min-height:150px;border:1px solid var(--line);border-radius:24px;padding:17px;background:linear-gradient(145deg,#fff,#fbf8ff);text-align:left}.subject.active{border:2px solid var(--purple);box-shadow:0 10px 25px #7652bd20}.subject .big{font-size:43px}.subject h3{font-size:19px;margin:5px 0}.subject p{color:var(--muted);margin:0}
.mission{display:grid;grid-template-columns:50px 1fr 42px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.mission:last-child{border-bottom:0}.mi{width:50px;height:50px;border-radius:17px;background:#fff4bd;display:grid;place-items:center;font-size:27px}.mission h3{margin:0;font-size:16px}.mission p{margin:3px 0;color:var(--muted);font-size:13px}.meta{color:var(--green);font-size:12px;font-weight:900}.plus,.check{border:0;border-radius:50%;width:42px;height:42px;font-size:24px}.plus{background:#eaf8f4;color:var(--green)}.check{background:#dff6ed;color:var(--green)}
.banner{background:linear-gradient(135deg,#ffe889,#fff3c5);border:1px solid #efd66a;border-radius:20px;padding:15px;text-align:center;font-weight:900}
.btn{border:0;border-radius:16px;padding:12px 16px;background:var(--pink);color:#fff;font-weight:900;box-shadow:0 6px 14px #e65b9125}.purple{background:var(--purple)}.green{background:var(--green)}.yellow{background:var(--yellow);color:#5e4b00}
.meter{height:10px;background:#eee;border-radius:20px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow))}
.bar{margin:9px 0}.barline{display:flex;justify-content:space-between;font-size:12px;font-weight:900}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:86px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:100;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;color:#746d75;font-size:12px}.bottom b{display:block;font-size:24px;line-height:29px}.bottom .active{color:var(--pink);font-weight:900}
.choice{width:100%;padding:13px;margin:5px 0;border:1px solid var(--line);background:#fff;border-radius:15px;text-align:left;font-weight:800}.choice.correct{background:#eaf8f4;border-color:var(--green)}.choice.wrong{background:#fff0f1;border-color:#e45867}
.feedback{padding:14px;border-radius:17px;margin-top:10px;font-weight:750}.good{background:#eaf8f4;color:#167e68}.bad{background:#fff0f1;color:#a83848}.info{background:#f0eaff;color:#5c4192}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin:5px 0 10px;background:#fff}textarea{min-height:88px;resize:vertical}
.chat{background:#f7f2ff;border-radius:22px;padding:12px;min-height:230px;max-height:420px;overflow:auto}.bubble{padding:11px 14px;border-radius:18px;margin:8px 0;max-width:90%;line-height:1.4}.bubble.pet{background:#fff;border:1px solid #eadff3}.bubble.me{background:var(--purple);color:#fff;margin-left:auto}.chatrow{display:grid;grid-template-columns:1fr auto auto;gap:7px}.quick{overflow:auto;flex-wrap:nowrap}.quick button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px}
.story{background:#fff3c9;border-radius:20px;padding:16px;line-height:1.6}
.voiceRow{display:flex;gap:8px;flex-wrap:wrap}.voiceStatus{font-size:12px;color:var(--muted);margin:5px 0}
.modal{position:fixed;inset:0;background:#19141e99;display:none;align-items:flex-end;z-index:200}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:30px 30px 0 0;padding:20px}.close{float:right;border:0;background:#f5edf6;border-radius:50%;width:40px;height:40px;font-size:22px}
.reward{position:fixed;inset:0;background:#1e1423bb;display:none;align-items:center;justify-content:center;z-index:300;padding:20px}.reward.show{display:flex}.rewardbox{background:#fff;border-radius:30px;padding:25px;text-align:center;width:min(500px,100%)}.bigstar{font-size:110px}
.note{font-size:12px;color:var(--muted)}.small{font-size:13px;color:var(--muted)}
/* 3D WORLD */
.world{height:300px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(#bfe9ff 0 58%,#9edb88 58%);perspective:900px;box-shadow:inset 0 -45px 80px #43804c30}
.world:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 22%,#fff 0 18px,transparent 19px),radial-gradient(circle at 25% 18%,#fff 0 13px,transparent 14px),radial-gradient(circle at 70% 20%,#fff 0 20px,transparent 21px);opacity:.65}
.ground{position:absolute;left:-15%;right:-15%;bottom:-90px;height:180px;background:#7fc56e;border-radius:50%;transform:rotateX(55deg);box-shadow:inset 0 20px 40px #4d9b55}
.path{position:absolute;left:-10%;right:-10%;bottom:20px;height:48px;background:#d9bd8e;border-radius:50%;transform:rotateX(60deg)}
.animal{position:absolute;width:125px;height:120px;bottom:65px;left:40%;transform-style:preserve-3d;z-index:5;filter:drop-shadow(0 18px 8px #234c3530)}
.animal.moving{animation:travel 11s linear forwards}
@keyframes travel{0%{left:-145px;transform:scale(.9) rotateY(0)}18%{transform:scale(1) translateY(-8px) rotateY(0)}50%{left:calc(50% - 62px);transform:scale(1.05) translateY(0) rotateY(0)}53%{transform:scale(1.05) translateY(0) rotateY(180deg)}82%{left:calc(100% + 20px);transform:scale(.96) translateY(-6px) rotateY(180deg)}100%{left:calc(100% + 160px)}}
.body3d{position:absolute;width:80px;height:55px;left:25px;top:40px;border-radius:48% 52% 45% 45%;background:linear-gradient(135deg,#fff,#ddd);box-shadow:inset -13px -8px 15px #0002,8px 10px 10px #0002;transform:translateZ(16px)}
.head3d{position:absolute;width:55px;height:58px;left:70px;top:20px;border-radius:48%;background:linear-gradient(135deg,#fff,#d9d9d9);box-shadow:inset -10px -6px 12px #0002,7px 8px 9px #0002;transform:translateZ(28px)}
.eye{position:absolute;width:9px;height:9px;border-radius:50%;background:#18131b;top:21px;left:31px;box-shadow:0 0 0 2px #fff8}
.muzzle{position:absolute;width:24px;height:17px;border-radius:50%;background:#d9b3a9;left:27px;top:35px;transform:translateZ(6px)}
.nose{position:absolute;width:9px;height:6px;border-radius:50%;background:#252029;left:35px;top:38px}
.ear{position:absolute;width:23px;height:32px;border-radius:55% 55% 25% 25%;background:linear-gradient(135deg,#eee,#bbb);top:0;transform:translateZ(18px)}.ear.one{left:76px;transform:rotate(-12deg) translateZ(18px)}.ear.two{left:105px;transform:rotate(12deg) translateZ(18px)}
.leg{position:absolute;width:14px;height:38px;border-radius:10px;background:#ddd;top:82px;box-shadow:inset -4px -2px 5px #0002}.leg.l1{left:38px}.leg.l2{left:65px}.leg.l3{left:88px}
.tail{position:absolute;width:48px;height:15px;border-radius:50%;left:-10px;top:47px;background:#eee;transform:rotate(-25deg) translateZ(8px);transform-origin:right;animation:tail 1.1s ease-in-out infinite}@keyframes tail{50%{transform:rotate(25deg) translateZ(8px)}}
.breath{animation:breath 1.8s ease-in-out infinite}@keyframes breath{50%{transform:scale(1.025) translateZ(2px)}}
.blink{animation:blink 4s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mouthMove{animation:mouth 1.2s ease-in-out infinite}@keyframes mouth{50%{transform:scaleY(.65) translateZ(7px)}}
/* species variants */
.animal.cat .body3d{background:linear-gradient(135deg,#c8b7aa,#7b665b)}.animal.cat .head3d{background:linear-gradient(135deg,#d7c5b8,#8c7569)}.animal.cat .ear{background:#a98778;clip-path:polygon(50% 0,100% 100%,0 100%)}.animal.cat .muzzle{background:#f1c6c4}
.animal.rabbit .body3d,.animal.rabbit .head3d{background:linear-gradient(135deg,#fff,#ded8dc)}.animal.rabbit .ear{height:50px;background:linear-gradient(135deg,#fff,#d7d0d4);border-radius:60% 60% 40% 40%}
.animal.parrot .body3d{background:linear-gradient(135deg,#39d56c,#18a85c)}.animal.parrot .head3d{background:linear-gradient(135deg,#35cf70,#19a44f)}.animal.parrot .muzzle{width:20px;height:25px;left:27px;top:32px;background:#f1c22f;clip-path:polygon(0 0,100% 20%,35% 100%)}.animal.parrot .nose{display:none}.animal.parrot .body3d:after{content:"";position:absolute;width:30px;height:45px;right:-8px;top:5px;background:#11a7d1;border-radius:70% 20% 70% 20%;transform:rotate(-20deg);box-shadow:10px 5px 0 #e8d72d}
.animal.parrot .tail{background:#1979b9;height:22px;transform:rotate(12deg)}
.accessory{position:absolute;z-index:8;left:45px;top:35px;font-size:27px;transform:translateZ(45px) rotate(-8deg);filter:drop-shadow(2px 4px 3px #0003)}
.animal.parrot .accessory{left:83px;top:4px}
.animal.cat .accessory{left:84px;top:2px}.animal.rabbit .accessory{left:79px;top:1px}
.speak .head3d{animation:headTalk .55s ease-in-out infinite}@keyframes headTalk{50%{transform:translateZ(32px) rotateZ(-2deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">⭐ Mis Pequeñas Misiones · 6.0+ Consolidada</div>
  <header class="head">
    <div class="brand"><span class="brandIcon">⭐</span><div><b>Mis Pequeñas Misiones</b><small>Aprende · juega · cuida · descubre</small></div></div>
    <button class="bell" onclick="notify()">🔔</button>
  </header>
  <main id="screen"></main>
  <nav class="bottom">
    <button id="n-home" onclick="go('home')"><b>🏠</b>Inicio</button>
    <button id="n-learn" onclick="go('learn')"><b>🎯</b>Aprender</button>
    <button id="n-prize" onclick="go('prize')"><b>🏆</b>Premios</button>
    <button id="n-pet" onclick="go('pet')"><b>🐾</b>Mascota</button>
    <button id="n-mom" onclick="openMom()"><b>🔐</b>Mamá</button>
  </nav>
</div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<div id="reward" class="reward"><div class="rewardbox"><div class="bigstar">⭐</div><h2>¡REGALO DESBLOQUEADO!</h2><p id="rewardText"></p><button class="btn" onclick="closeReward()">¡Genial! 🎉</button></div></div>

<script>
const KEY='MPM5_FINAL_DATA';
const AI_ENDPOINT=localStorage.getItem('MPM_AI_ENDPOINT')||'';
const subjects={
  Español:{icon:'🇪🇸',color:'pink',desc:'Lectura, ortografía, comprensión y escritura.'},
  Matemáticas:{icon:'🔢',color:'purple',desc:'Cálculo, problemas, lógica y razonamiento.'},
  Ciencias:{icon:'🌱',color:'green',desc:'Naturaleza, cuerpo, animales, energía y experimentos.'},
  Inglés:{icon:'🇺🇸',color:'yellow',desc:'Listen, answer, speak: práctica dinámica con voz.'}
};
const langs={Inglés:['🇺🇸',[
 ['apple','manzana'],['school','escuela'],['friend','amigo'],['water','agua'],['book','libro'],['happy','feliz'],['house','casa'],['play','jugar'],['family','familia'],['garden','jardín'],['animal','animal'],['teacher','maestro']
]]};
const initial={
 pin:'2580',reward:'¡Ganaste un helado! 🍦',child:'eliseo',
 learning:{subject:'Español',level:'Básico',xp:120,streak:3,weekly:{practices:0,words:0,conversations:0,stories:0}},
 kids:{
  violeta:{name:'Violeta',age:13,level:7,stars:48,streak:6,ach:4,avatar:'👧',pet:{species:'dog',emoji:'🐶',name:'Luna',happy:80,food:78,energy:88,clean:92,healthy:true,toy:'🎾',accessory:'🎀'}},
  eliseo:{name:'Eliseo',age:9,level:5,stars:42,streak:8,ach:3,avatar:'👦',pet:{species:'cat',emoji:'🐱',name:'Milo',happy:91,food:85,energy:90,clean:88,healthy:true,toy:'🧶',accessory:'🧣'}},
  misael:{name:'Misael',age:7,level:3,stars:38,streak:4,ach:2,avatar:'👦',pet:{species:'rabbit',emoji:'🐰',name:'Nube',happy:86,food:80,energy:92,clean:93,healthy:true,toy:'🥕',accessory:'🎩'}}
 },
 missions:[
  ['Alimentación saludable','Come frutas y toma agua','13:00',2,'🍎'],['Dientes y baño','Cepíllate los dientes y báñate','18:00',2,'🪥'],
  ['Apagar luces y TV','Apaga lo que no se usa','19:30',2,'💡'],['Prepararse para dormir','Pijama, dientes y a la cama','20:30',3,'🌙'],
  ['Ve a la escuela','Mochila lista y llegar a tiempo','07:15',2,'🎒'],['Hora de limpiar','Ordena tus cosas y colabora en casa','17:00',2,'🧹'],
  ['Hacer tareas / repasar','Completa tus deberes escolares','16:00',3,'📚'],['Cena saludable','Cena y descubre un tip','19:00',2,'🥗'],
  ['Actividad física','Muévete 15 minutos','17:30',2,'🏃'],['Cuidar animales','Alimenta gallinas y periquitos','08:00',2,'🐔']
 ].map((x,i)=>({id:i+1,n:x[0],d:x[1],t:x[2],s:x[3],i:x[4],done:false})),
 history:[],petChat:[]
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function norm(d){
 d=d||clone(initial);
 d.pin=/^\\d{4}$/.test(d.pin||'')?d.pin:'2580';
 d.kids=d.kids||clone(initial.kids);
 Object.keys(initial.kids).forEach(k=>{d.kids[k]=Object.assign(clone(initial.kids[k]),d.kids[k]||{});d.kids[k].pet=Object.assign(clone(initial.kids[k].pet),d.kids[k].pet||{});});
 d.child=d.kids[d.child]?d.child:'eliseo';
 d.learning=Object.assign(clone(initial.learning),d.learning||d.lang||{});
 d.learning.weekly=Object.assign(clone(initial.learning.weekly),d.learning.weekly||{});
 d.learning.subject=d.learning.subject||'Español';
 d.missions=Array.isArray(d.missions)?d.missions:clone(initial.missions);
 d.history=d.history||[];d.petChat=d.petChat||[];
 return d;
}
let D=norm(JSON.parse(localStorage.getItem(KEY)||'null'));save();

function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function C(){return D.kids[D.child]}
function go(p){document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));let n=document.getElementById('n-'+p);if(n)n.classList.add('active');if(p==='home')home();if(p==='learn')learn();if(p==='prize')prize();if(p==='pet')pet()}
function childTabs(){return `<div class="tabs">${Object.entries(D.kids).map(([k,c])=>`<button class="tab ${D.child===k?'active':''}" onclick="D.child='${k}';save();home()">${c.name}<br><small>${c.age} años</small></button>`).join('')}</div>`}
function fmt(t){let[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}
function bar(n,v){return `<div class="bar"><div class="barline"><span>${n}</span><span>${Math.round(v)}%</span></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div></div>`}
function state(){let h=new Date().getHours();return{sleep:h>=20||h<7,school:h>=7&&h<14,play:h>=15&&h<19}}
function petMood(p){let s=state();if(!p.healthy)return'🤒 No me siento bien. Necesito cuidados.';if(p.food<30)return'🥺 Tengo hambre... ¿me das de comer?';if(p.clean<30)return'🧼 Necesito limpieza.';if(s.sleep)return'😴 Estoy dormido/a... Zzz';if(s.school)return'🎒 ¡Hora de escuela!';if(s.play)return`🎾 ¡Hora de jugar con mi ${p.toy}!`;return'🥰 ¡Estoy feliz y bien cuidada!'}
function missionStatus(m){if(m.done)return'Completada ✓';let[h,mi]=m.t.split(':').map(Number),d=new Date();d.setHours(h,mi,0,0);let x=d-new Date();if(x<0)return'⚠️ Vencida';if(x<3600000)return`⏰ Vence en ${Math.max(1,Math.round(x/60000))} min`;return`⏰ ${fmt(m.t)}`}
function advice(m){let n=m.n.toLowerCase();if(n.includes('limpiar'))return'🧹 Acuérdate: falta poco para tu tarea de limpieza.';if(n.includes('aliment'))return'🍎 ¡Hora de comer saludable!';if(n.includes('dorm'))return'🌙 Ya casi es hora de dormir.';if(n.includes('escuela'))return'🎒 ¡Prepara tu mochila!';if(n.includes('tarea'))return'📚 ¿Hacemos la tarea juntos?';return'🐾 Recuerda tu misión. ¡Tú puedes!'}

function home(){
 let c=C(),p=c.pet,s=state();
 document.getElementById('screen').innerHTML=childTabs()+`
 <section class="card profile hero"><div class="avatar">${c.avatar}</div><div><h2>¡Hola, ${c.name}! 🌟</h2><p>${c.age} años · Nivel ${c.level}</p><div class="chips"><span class="chip">⭐ ${c.stars}</span><span class="chip">🔥 ${c.streak}</span><span class="chip">🏆 ${c.ach}</span><span class="chip">🧠 ${D.learning.xp} XP</span></div></div></section>
 <section class="card"><div class="sectionHead"><h2>📋 Misiones del día</h2><button class="outline" onclick="showAll()">Ver todas</button></div>
 ${D.missions.slice(0,6).map(m=>`<div class="mission"><div class="mi">${m.i}</div><div onclick="bubble(advice(D.missions.find(x=>x.id===${m.id})))"><h3>${m.n}</h3><p>${m.d}</p><div class="meta">${missionStatus(m)} · ⭐${m.s}</div></div><button class="${m.done?'check':'plus'}" onclick="complete(${m.id})">${m.done?'✓':'+'}</button></div>`).join('')}</section>
 <div class="banner">¡Completa tus misiones y gana estrellas extra! 🎁</div>
 <section class="card"><h2>🎓 Aprendizaje</h2><p>Cuatro materias con actividades que cambian, razonamiento paso a paso y retos que se adaptan.</p><div class="grid">
 ${Object.entries(subjects).map(([s,x])=>`<button class="tile" onclick="D.learning.subject='${s}';save();go('learn')"><span class="ico">${x.icon}</span><strong>${s}</strong><small>${x.desc}</small></button>`).join('')}</div></section>
 <section class="card"><h2>💡 Consejo de hoy</h2><p>${dailyTip()}</p><button class="outline" onclick="bubble('✨ '+dailyTip())">Otro consejo</button></section>
 ${petWorld(c,p)}
 </section>`;
}
function dailyTip(){return['Ordena tus cosas después de jugar. 🧸','Toma agua durante el día. 💧','Cepíllate los dientes con calma. 🪥','Aprende algo nuevo hoy. 📚','Ayuda en casa con una pequeña tarea. 🏠'][new Date().getDate()%5]}
function complete(id){let m=D.missions.find(x=>x.id===id);if(!m||m.done)return;m.done=true;C().stars+=m.s;C().ach++;D.history.unshift({kid:D.child,text:'Completó '+m.n,stars:m.s,date:new Date().toLocaleString()});save();home();if(D.missions.every(x=>x.done))showReward()}

let Q=null;
function makeQ(){
 const s=D.learning.subject, level=D.learning.level||'Básico', day=new Date().getDate(), n=D.learning.xp+D.learning.weekly.practices+day;
 if(s==='Matemáticas'){
   const a=(n%8)+2,b=((n*3)%9)+2;
   const type=n%3;
   if(type===0)return{q:`¿Cuánto es ${a} × ${b}?`,opts:shuffle([a*b,a*b+2,a*b-2]),ans:a*b,ex:`Multiplicamos ${a} por ${b}: ${a} × ${b} = ${a*b}.`};
   if(type===1)return{q:`Si tienes ${a*b} caramelos y repartes ${b} en cada grupo, ¿cuántos grupos puedes formar?`,opts:shuffle([a,a+1,a-1]),ans:a,ex:`${a*b} ÷ ${b} = ${a}.`};
   return{q:`Completa: ${a} + ___ = ${a+b}`,opts:shuffle([b,b+1,b-1]),ans:b,ex:`Restamos ${a+b} − ${a} = ${b}.`};
 }
 if(s==='Ciencias'){
   const qs=[['¿Cuál necesita una planta para realizar la fotosíntesis?',['Luz solar','Un videojuego','Un lápiz'],'Luz solar','La planta usa luz solar, agua y dióxido de carbono para producir su alimento.'],
             ['¿Qué órgano usamos principalmente para respirar?',['Pulmones','Estómago','Rodilla'],'Pulmones','Los pulmones permiten el intercambio de oxígeno y dióxido de carbono.'],
             ['¿Cuál es un animal vertebrado?',['Pez','Mariposa','Lombriz'],'Pez','Los peces tienen columna vertebral.']];
   let x=qs[n%qs.length];return{q:x[0],opts:x[1],ans:x[2],ex:x[3]};
 }
 if(s==='Inglés'){
   let pool=langs.Inglés[1],x=pool[n%pool.length],y=pool[(n+3)%pool.length],z=pool[(n+5)%pool.length];
   let opts;
   if(n%3===0){opts=shuffle([x[1],y[1],z[1]]);return{q:`What does “${x[0]}” mean?`,opts,ans:x[1],ex:`“${x[0]}” significa “${x[1]}”.`}}
   opts=shuffle([x[0],y[0],z[0]]);return{q:`Choose the English word for “${x[1]}”.`,opts,ans:x[0],ex:`La palabra correcta es “${x[0]}”.`};
 }
 const qs=[['¿Cuál palabra está escrita correctamente?',['árbol','arvol','árvol'],'árbol','“Árbol” lleva b y tilde.'],['¿Cuál es un sustantivo?',['perro','corriendo','rápidamente'],'perro','“Perro” nombra a un ser, por eso es sustantivo.'],['¿Qué oración tiene sentido completo?',['El gato duerme.','Porque en la casa.','Muy rápidamente.'],'El gato duerme.','Tiene sujeto y predicado y expresa una idea completa.']];
 let x=qs[n%qs.length];return{q:x[0],opts:x[1],ans:x[2],ex:x[3]};
}

function answer(i){
 let bs=[...document.querySelectorAll('.choice')],ok=Q.opts.indexOf(String(Q.ans));
 if(ok<0)ok=Q.opts.findIndex(x=>x===Q.ans);
 bs.forEach((b,n)=>{b.disabled=true;if(n===ok)b.classList.add('correct');if(n===i&&n!==ok)b.classList.add('wrong')});
 if(i===ok){C().stars++;D.learning.xp+=10;D.learning.weekly.practices++;D.learning.weekly.words++;document.getElementById('fb').innerHTML=`<div class="feedback good">🎉 ¡Correcto! +10 XP y ⭐1.<br>${Q.ex}<br><button class="btn green" onclick="learn()">Siguiente →</button></div>`}
 else{C().stars=Math.max(0,C().stars-1);D.learning.xp=Math.max(0,D.learning.xp-5);document.getElementById('fb').innerHTML=`<div class="feedback bad">💡 Vamos a entenderlo.<br><b>Respuesta correcta: ${Q.ans}</b><br>${Q.ex}<br><button class="btn purple" onclick="learn()">Intentarlo de nuevo →</button></div>`}
 save();
}

async function smartReply(t,p){
 if(AI_ENDPOINT){
   try{let res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,child:C().name,age:C().age,subject:D.learning.subject,pet:p.name})});if(res.ok){let j=await res.json();if(j.reply)return j.reply}}catch(e){}
 }
 return localReasoner(t,p);
}
function localReasoner(raw,p){
 let t=raw.toLowerCase().trim(),g=p.species==='dog'?'¡Guauuu! 🐶':p.species==='parrot'?'¡Hola hola! 🦜':p.species==='cat'?'Miauu 😺':'¡Hola! 🐾';
 let math=solveMath(raw);
 if(math)return `${g} Vamos paso a paso. ${math}`;
 if(/no sé|no se|respuesta|pregunta/.test(t))return`${g} No pasa nada. Primero leemos la pregunta, buscamos qué datos tenemos, pensamos qué nos pide y después comprobamos la respuesta. Escríbeme el ejercicio completo.`;
 if(/tarea|deber|ejercicio|matem|español|ciencia|inglés|english|school|escuela/.test(t))return`${g} Claro. Voy a ayudarte a entender la consigna antes de darte la respuesta. Escríbeme el ejercicio completo, incluyendo los datos y las opciones si las hay.`;
 if(/divert|jugar|funny/.test(t))return`${g} ¡Sí! 🎾 Hagamos un reto: dime un número del 1 al 10 y te invento una misión sorpresa.`;
 if(/english|inglés|habla en inglés|speak/.test(t))return`Sure! 🇺🇸 Let's practice. Tell me: What is your favorite animal?`;
 if(/hola|hello|hey/.test(t))return`${g} ¡Qué alegría verte! ¿Quieres aprender, jugar o resolver una tarea?`;
 if(/comida|hambre/.test(t))return'🍖 Mi pancita dice que tengo hambre... ¿me das de comer?';
 if(/limpiar/.test(t))return'🧹 Recuerda tu misión de limpieza. ¡Puedes hacerla poquito a poquito!';
 if(/dormir|sueño/.test(t))return'😴 Cuando llegue mi hora cierro mis ojitos y salen mis ZZZ.';
 return`${g} Entiendo lo que me dices. Voy a pensarlo contigo. ¿Quieres que lo resolvamos paso a paso o prefieres una pista? 🧠🐾`;
}
function solveMath(raw){
 let s=raw.replace(/,/g,'.').match(/(-?\\d+(?:\\.\\d+)?)\\s*(\\+|\\-|×|x|\\*|÷|\\/|:)\\s*(-?\\d+(?:\\.\\d+)?)/i);if(!s)return null;
 let a=Number(s[1]),op=s[2],b=Number(s[3]),r=op==='+'?a+b:op==='-'?a-b:/×|x|\\*/i.test(op)?a*b:a/b;
 if(!Number.isFinite(r))return'La división no se puede hacer así. Probemos con otros números.';
 return`Tenemos ${a} ${op} ${b}. Calculamos: ${a} ${op} ${b} = ${r}. Ahora revisamos si esa respuesta tiene sentido.`;
}
function escapeHTML(x){return x.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

/* VOZ REAL: Speech Recognition + Speech Synthesis cuando el navegador los ofrece */
let recognition=null;
function startVoice(targetId){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){let el=document.getElementById('voiceStatus');if(el)el.textContent='Este navegador no ofrece reconocimiento de voz. Puedes escribir.';return}
 recognition=new SR();recognition.lang=D.learning.subject==='Inglés'?'en-US':'es-DO';recognition.interimResults=false;recognition.maxAlternatives=1;
 const st=document.getElementById('voiceStatus');if(st)st.textContent='🎙️ Escuchando...';
 recognition.onresult=e=>{document.getElementById(targetId).value=e.results[0][0].transcript;let z=document.getElementById('voiceStatus');if(z)z.textContent='✅ Te escuché.'};
 recognition.onerror=()=>{let z=document.getElementById('voiceStatus');if(z)z.textContent='No pude captar la voz. Inténtalo otra vez.'};
 recognition.onend=()=>{let z=document.getElementById('voiceStatus');if(z&&z.textContent.includes('Escuchando'))z.textContent='Listo.'};
 recognition.start();
}
function speak(text){
 if(!text||!('speechSynthesis' in window))return;
 speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);
 u.lang=D.learning.subject==='Inglés'||/\\b(the|what|favorite|hello|sure|let us)\\b/i.test(text)?'en-US':'es-DO';
 u.rate=.92;u.pitch=1.08;speechSynthesis.speak(u);
}

let pinIn='';
function openMom(){document.getElementById('modal').classList.add('show');pinIn='';document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>🔐 Panel de Mamá</h2><p>Ingresa tu clave de 4 dígitos.</p><div style="text-align:center;font-size:24px;color:var(--purple)" id="dots">○ ○ ○ ○</div><div class="grid">${[1,2,3,4,5,6,7,8,9,'×',0,'⌫'].map(x=>`<button class="tile" style="min-height:55px;text-align:center" onclick="pin('${x}')">${x}</button>`).join('')}</div>`}
function pin(x){if(x==='×'){closeModal();return}if(x==='⌫')pinIn=pinIn.slice(0,-1);else if(pinIn.length<4)pinIn+=x;document.getElementById('dots').textContent='• '.repeat(pinIn.length)+'○ '.repeat(4-pinIn.length);if(pinIn.length===4){if(pinIn===D.pin)dashboard();else{bubble('🔐 Clave incorrecta');setTimeout(openMom,800)}}}
function dashboard(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>💗 Panel de Mamá</h2><div class="grid"><button class="tile" onclick="extra()">⭐<strong>Dar estrellas</strong></button><button class="tile" onclick="manage()">📅<strong>Misiones</strong></button><button class="tile" onclick="progress()">📊<strong>Progreso</strong></button><button class="tile" onclick="hist()">🕘<strong>Historial</strong></button><button class="tile" onclick="aiSettings()">🤖<strong>IA</strong><small>Conectar endpoint</small></button><button class="tile" onclick="resetData()">♻️<strong>Restablecer</strong></button></div><section class="card"><h3>🔑 Cambiar clave</h3><input id="np" maxlength="4" inputmode="numeric" value="${D.pin}"><button class="btn purple" onclick="changePin()">Guardar clave</button></section><section class="card"><h3>🐾 Salud</h3>${Object.values(D.kids).map(c=>`<p>${c.pet.emoji} ${c.pet.name}: ${c.pet.healthy?'😊 saludable':'🤒 necesita cuidados'} · 🍖${Math.round(c.pet.food)} · 🧼${Math.round(c.pet.clean)}</p>`).join('')}</section>`}
function changePin(){let p=document.getElementById('np').value;if(/^\\d{4}$/.test(p)){D.pin=p;save();dashboard()}else bubble('Usa exactamente 4 dígitos.')}
function extra(){let k=prompt('violeta, eliseo o misael','eliseo'),n=Number(prompt('1, 2, 3 o 5 estrellas','3'));if(D.kids[k]&&[1,2,3,5].includes(n)){D.kids[k].stars+=n;D.history.unshift({kid:k,text:'Estrellas otorgadas por mamá',stars:n,date:new Date().toLocaleString()});save();dashboard()}}
function manage(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="dashboard()">←</button><h2>📅 Misiones y horarios</h2>${D.missions.map(m=>`<div class="mission"><div class="mi">${m.i}</div><div><h3>${m.n}</h3><p>${m.d}</p><div class="meta">${fmt(m.t)} · ⭐${m.s}</div></div><button class="${m.done?'check':'plus'}" onclick="mDone(${m.id})">${m.done?'✓':'+'}</button></div>`).join('')}<section class="card"><h3>➕ Nueva misión</h3><input id="mn" placeholder="Ej. Leer 20 minutos"><input id="mt" type="time" value="17:00"><button class="btn" onclick="addM()">Agregar</button></section>`}
function mDone(id){let m=D.missions.find(x=>x.id===id);if(m)m.done=!m.done;save();manage()}
function addM(){let n=document.getElementById('mn').value.trim();if(!n)return;D.missions.push({id:Date.now(),n,d:'Misión personalizada',t:document.getElementById('mt').value,s:2,i:'✨',done:false});save();manage()}
function progress(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="dashboard()">←</button><h2>📊 Progreso</h2>${Object.values(D.kids).map(c=>`<section class="card"><b>${c.avatar} ${c.name}</b><p>⭐${c.stars} · 🔥${c.streak} días · Nivel ${c.level}</p>${bar('Progreso',c.stars%100)}</section>`).join('')}`}
function hist(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="dashboard()">←</button><h2>🕘 Historial</h2>${D.history.slice(0,20).map(h=>`<p>⭐${h.stars} · ${D.kids[h.kid].name}<br><small>${h.text} · ${h.date}</small></p>`).join('')||'<p>Sin movimientos.</p>'}`}
function aiSettings(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="dashboard()">←</button><h2>🤖 Conexión IA</h2><p>La app funciona sin servidor con un razonador local. Para una IA externa, configura un endpoint propio que acepte POST JSON y devuelva <code>{\"reply\":\"...\"}</code>.</p><input id="aie" value="${escapeHTML(localStorage.getItem('MPM_AI_ENDPOINT')||'')}" placeholder="https://tu-servidor.example/api/chat"><button class="btn purple" onclick="localStorage.setItem('MPM_AI_ENDPOINT',document.getElementById('aie').value.trim());dashboard()">Guardar</button><p class="note">No coloques claves secretas de una API directamente en index.html. Usa un backend/proxy seguro.</p>`}
function resetData(){if(confirm('¿Restablecer los datos guardados de esta app?')){localStorage.removeItem(KEY);location.reload()}}

home();go('home');setInterval(spawn,12000);setInterval(decay,60000);
</script>
</body>
</html>
