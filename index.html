<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191a20">
<title>Mis Pequeñas Misiones</title>

<style>
:root{
  --pink:#ec5b89;
  --pink2:#f6a4bc;
  --purple:#7953bd;
  --purple2:#9a70dc;
  --yellow:#ffd83d;
  --green:#21a789;
  --blue:#2f80c9;
  --ink:#403647;
  --muted:#7c747d;
  --bg:#fbf7fb;
  --line:#e9dfe8;
  --card:#fff;
  --soft:#fff2f7;
  --blueSoft:#edfaff;
  --shadow:0 5px 20px rgba(50,30,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#191a20;
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{min-height:100vh}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
  max-width:720px;
  min-height:100vh;
  margin:auto;
  background:linear-gradient(#fffafd,#faf7fb);
  padding-bottom:92px;
}

.topbar{
  height:58px;
  background:#191a20;
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 18px;
  font-weight:800;
  font-size:18px;
}

.header{
  background:#fffafd;
  border-bottom:1px solid var(--line);
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand .star{
  font-size:52px;
  line-height:1;
}

.brand h1{
  font-size:27px;
  margin:0;
  letter-spacing:-.6px;
}

.brand p{
  margin:0;
  color:#817985;
  font-size:15px;
}

.iconbtn{
  border:0;
  background:white;
  border-radius:22px;
  width:58px;
  height:58px;
  box-shadow:var(--shadow);
  font-size:28px;
}

main{padding:15px 18px}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:25px;
  box-shadow:var(--shadow);
  padding:17px;
  margin:12px 0;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:9px;
}

.section-head h2{
  margin:0;
  font-size:23px;
}

.child-tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:0 0 14px;
}

.child-tab{
  border:1px solid var(--line);
  background:#fff;
  border-radius:18px;
  padding:10px 15px;
  min-width:108px;
  font-weight:800;
  color:var(--muted);
}

.child-tab.active{
  background:#fff0f6;
  border:2px solid var(--pink);
  color:var(--pink);
}

.profile{
  display:flex;
  gap:16px;
  align-items:center;
  background:linear-gradient(135deg,#fff,#fff1f7);
  padding:19px;
}

.avatar{
  width:88px;
  height:88px;
  border-radius:28px;
  background:#eee4ff;
  display:grid;
  place-items:center;
  font-size:54px;
  flex:none;
}

.profile h2{
  margin:0;
  font-size:27px;
}

.age{
  color:var(--muted);
  font-size:16px;
  margin:3px 0 9px;
}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.chip{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:6px 10px;
  font-weight:800;
  font-size:13px;
}

.outline{
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  padding:10px 14px;
  font-weight:800;
}

.mission{
  display:grid;
  grid-template-columns:52px 1fr 45px;
  gap:12px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.mission:last-child{border-bottom:0}

.mi{
  width:52px;
  height:52px;
  border-radius:18px;
  background:#fff4bd;
  display:grid;
  place-items:center;
  font-size:28px;
}

.mission h3{
  margin:0;
  font-size:17px;
}

.mission p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:14px;
}

.meta{
  color:var(--green);
  font-weight:800;
  font-size:13px;
  margin-top:5px;
}

.plus,.check{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  font-weight:900;
  font-size:24px;
}

.plus{
  background:#eaf8f4;
  color:var(--green);
}

.check{
  background:#dff6ed;
  color:var(--green);
}

.banner{
  background:linear-gradient(135deg,#ffe889,#fff3c5);
  border:1px solid #efd66a;
  border-radius:21px;
  padding:16px;
  text-align:center;
  font-weight:900;
  font-size:16px;
  margin:14px 0;
}

.banner span{
  font-size:28px;
  margin-left:8px;
}

.learn-card{
  background:linear-gradient(135deg,#f5edff,#fff);
}

.pill{
  display:inline-block;
  background:#eee5fb;
  color:#6b46a7;
  border-radius:16px;
  padding:6px 10px;
  font-size:12px;
  font-weight:800;
}

.btn{
  border:0;
  border-radius:15px;
  padding:12px 15px;
  background:var(--pink);
  color:white;
  font-weight:900;
}

.btn.purple{background:var(--purple)}
.btn.green{background:var(--green)}
.btn.yellow{background:var(--yellow);color:#654d00}
.btn.blue{background:var(--blue)}

.full{
  width:100%;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.tile{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:15px;
  text-align:left;
}

.tile:hover{
  transform:translateY(-1px);
}

.tile .ico{
  font-size:28px;
  display:block;
}

.tile strong{
  display:block;
  margin-top:5px;
}

.tile small{
  color:var(--muted);
}

.subject{
  min-height:140px;
}

.subject.active{
  border:2px solid var(--purple);
  background:#faf6ff;
}

.progress{
  height:11px;
  background:#eee8f2;
  border-radius:20px;
  overflow:hidden;
}

.progress i,
.meter i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--pink),var(--yellow));
  border-radius:20px;
}

.meter{
  height:10px;
  border-radius:20px;
  background:#eee;
  overflow:hidden;
}

.pet{
  background:linear-gradient(135deg,#ecfaff,#fff);
}

.pet h2{
  text-align:center;
  margin:0 0 5px;
}

.petname{
  text-align:center;
  font-size:22px;
  font-weight:900;
}

/* =========================
   MASCOTA + ACCESORIOS
========================= */

.pet-stage{
  width:220px;
  height:210px;
  margin:4px auto 10px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.pet-body{
  font-size:135px;
  line-height:1;
  position:relative;
  z-index:2;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.06));
}

.accessory{
  position:absolute;
  z-index:4;
  pointer-events:none;
  line-height:1;
  transform-origin:center center;
}

/* Perro */
.pet-stage.dog .accessory{
  top:8px;
  left:50%;
  transform:translateX(-50%) scale(1.18);
}

.pet-stage.dog .accessory.glasses{
  top:73px;
  transform:translateX(-50%) scale(1.18);
}

/* Gato */
.pet-stage.cat .accessory{
  top:5px;
  left:50%;
  transform:translateX(-50%) scale(1.22);
}

.pet-stage.cat .accessory.glasses{
  top:73px;
  transform:translateX(-50%) scale(1.30);
}

/* Conejo */
.pet-stage.rabbit .accessory{
  top:0;
  left:50%;
  transform:translateX(-50%) scale(1.18);
}

.pet-stage.rabbit .accessory.glasses{
  top:70px;
  transform:translateX(-50%) scale(1.28);
}

/* Zorro */
.pet-stage.fox .accessory{
  top:5px;
  left:50%;
  transform:translateX(-50%) scale(1.22);
}

.pet-stage.fox .accessory.glasses{
  top:73px;
  transform:translateX(-50%) scale(1.28);
}

/* Panda */
.pet-stage.panda .accessory{
  top:6px;
  left:50%;
  transform:translateX(-50%) scale(1.20);
}

.pet-stage.panda .accessory.glasses{
  top:72px;
  transform:translateX(-50%) scale(1.28);
}

.pet-stage .accessory.big{
  transform:translateX(-50%) scale(1.35);
}

.pet-stage.cat .accessory.big{
  transform:translateX(-50%) scale(1.42);
}

.pet-stage.rabbit .accessory.big{
  transform:translateX(-50%) scale(1.30);
}

/* =========================
   CONSEJO DINÁMICO
========================= */

.tip-card{
  background:linear-gradient(135deg,#fffdf1,#fff8cc);
  border-color:#efdf91;
}

.tip-icon{
  font-size:35px;
}

.tip-text{
  font-size:18px;
  line-height:1.45;
  font-weight:700;
}

.tip-source{
  color:#7d6b25;
  font-size:13px;
  font-weight:800;
}

/* =========================
   ACADEMIA
========================= */

.academy-card{
  background:linear-gradient(135deg,#f1eaff,#fff);
  border-color:#ddd0f5;
}

.academy-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.academy-title{
  display:flex;
  align-items:center;
  gap:9px;
}

.academy-title h2{
  margin:0;
  font-size:23px;
}

.language-tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:4px 0 10px;
}

.language-tabs button{
  white-space:nowrap;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:11px 7px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:17px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

.lesson-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
}

.question{
  font-size:21px;
  font-weight:900;
  line-height:1.3;
  margin:12px 0;
}

.answer-btn{
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  background:#fff;
  padding:14px;
  border-radius:16px;
  margin:6px 0;
  font-weight:750;
}

.answer-btn.correct{
  background:#e4f8ef;
  border-color:#61c49d;
}

.answer-btn.wrong{
  background:#fff0f3;
  border-color:#e99aaa;
}

.feedback{
  padding:12px;
  border-radius:15px;
  margin-top:10px;
  font-weight:800;
}

.feedback.ok{
  background:#e7f8f0;
  color:#167e62;
}

.feedback.no{
  background:#fff0f3;
  color:#a6405b;
}

.challenge{
  background:#fff8d9;
  border:1px solid #efd66a;
  border-radius:19px;
  padding:15px;
}

/* =========================
   BURBUJA DE MASCOTA
========================= */

.pet-bubble{
  position:fixed;
  right:16px;
  bottom:96px;
  width:min(390px,calc(100% - 32px));
  background:white;
  border:2px solid #e4d8ee;
  border-radius:24px;
  box-shadow:0 15px 45px rgba(40,25,55,.20);
  padding:14px 16px;
  z-index:70;
  animation:bubbleIn .28s ease-out;
}

.pet-bubble:after{
  content:"";
  position:absolute;
  bottom:-10px;
  right:52px;
  width:19px;
  height:19px;
  background:white;
  border-right:2px solid #e4d8ee;
  border-bottom:2px solid #e4d8ee;
  transform:rotate(45deg);
}

.bubble-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.bubble-animal{
  font-size:43px;
}

.bubble-name{
  font-weight:900;
  font-size:17px;
}

.bubble-text{
  margin:7px 0 2px;
  font-size:15px;
  line-height:1.4;
}

.bubble-close{
  margin-left:auto;
  border:0;
  background:#f5edf6;
  border-radius:50%;
  width:32px;
  height:32px;
  font-weight:900;
}

@keyframes bubbleIn{
  from{
    opacity:0;
    transform:translateY(20px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);
  background:#403647;
  color:#fff;
  padding:12px 19px;
  border-radius:30px;
  font-weight:850;
  z-index:90;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   MODALES
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(25,20,30,.62);
  display:none;
  align-items:flex-end;
  z-index:100;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:22px;
}

.close{
  float:right;
  border:0;
  background:#f5edf6;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:23px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  margin:5px 0 10px;
  background:#fff;
  color:var(--ink);
}

textarea{
  min-height:80px;
  resize:vertical;
}

label{
  font-size:12px;
  font-weight:900;
}

.pin{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.pin button{
  padding:16px;
  border:1px solid #efb3c7;
  background:#fff;
  border-radius:22px;
  color:#d94e7d;
  font-weight:900;
  font-size:19px;
}

.dots{
  text-align:center;
  color:var(--pink);
  font-size:24px;
  letter-spacing:6px;
}

.reward{
  position:fixed;
  inset:0;
  background:rgba(30,20,35,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:120;
}

.reward.show{
  display:flex;
}

.rewardbox{
  background:#fff;
  border-radius:32px;
  text-align:center;
  padding:26px;
  width:min(500px,100%);
  box-shadow:0 20px 60px #0005;
  animation:pop .4s;
}

.bigstar{
  font-size:130px;
  line-height:1;
  animation:star 1s infinite alternate;
}

.rewardbox h2{
  color:var(--pink);
}

.rewardbox p{
  font-size:20px;
  font-weight:800;
}

@keyframes pop{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

@keyframes star{
  to{transform:scale(1.08) rotate(4deg)}
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(720px,100%);
  height:82px;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:50;
}

.bottom button{
  border:0;
  background:white;
  color:#746d75;
  font-size:12px;
  padding:6px;
}

.bottom b{
  display:block;
  font-size:25px;
  margin-bottom:2px;
}

.bottom .active{
  color:var(--pink);
  font-weight:900;
}

.muted{
  color:var(--muted);
}

.back{
  margin-bottom:10px;
}

@media(max-width:520px){
  .brand h1{font-size:24px}
  .brand .star{font-size:46px}
  .profile h2{font-size:24px}
  .avatar{
    width:80px;
    height:80px;
    font-size:50px;
  }
  .stat-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="topbar">
    ‹ &nbsp; Mis Pequeñas Misiones
  </div>

  <header class="header">
    <div class="brand">
      <div class="star">⭐</div>
      <div>
        <h1>Mis Pequeñas Misiones</h1>
        <p>Pequeñas acciones, grandes hábitos</p>
      </div>
    </div>

    <button class="iconbtn" onclick="notifyPet()">🔔</button>
  </header>

  <main id="screen"></main>

  <nav class="bottom">
    <button id="nav-home" onclick="go('home')">
      <b>🏠</b>Inicio
    </button>

    <button id="nav-learn" onclick="go('learn')">
      <b>🎯</b>Aprender
    </button>

    <button id="nav-prize" onclick="go('prize')">
      <b>🏆</b>Premios
    </button>

    <button id="nav-pet" onclick="go('pet')">
      <b>🐾</b>Mascota
    </button>

    <button id="nav-mom" onclick="openMom()">
      <b>🔐</b>Mamá
    </button>
  </nav>

</div>

<div id="petBubble"></div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal">
  <div id="sheet" class="sheet"></div>
</div>

<div id="reward" class="reward">
  <div class="rewardbox">
    <div class="bigstar">⭐</div>
    <h2>¡REGALO DESBLOQUEADO!</h2>
    <p id="rewardText"></p>
    <button class="btn" onclick="closeReward()">¡Genial! 🎉</button>
  </div>
</div>

/* =========================================================
   NORMALIZACIÓN
   IMPORTANTE: NO BORRA LOS DATOS ANTERIORES
========================================================= */

function cloneInitial(){
  return JSON.parse(JSON.stringify(initial));
}

function normalizeData(raw){

  const d=raw&&typeof raw==='object'
    ?raw
    :cloneInitial();

  const base=cloneInitial();

  if(!d.kids||typeof d.kids!=='object'){
    d.kids=base.kids;
  }

  Object.keys(base.kids).forEach(k=>{

    const b=base.kids[k];
    const c=d.kids[k]||{};

    c.name=c.name||b.name;
    c.age=Number(c.age)||b.age;
    c.level=Number(c.level)||b.level;
    c.stars=Number.isFinite(Number(c.stars))?Number(c.stars):b.stars;
    c.streak=Number.isFinite(Number(c.streak))?Number(c.streak):b.streak;
    c.ach=Number.isFinite(Number(c.ach))?Number(c.ach):b.ach;
    c.avatar=c.avatar||b.avatar;

    c.pet=Object.assign({},b.pet,c.pet||{});

    ['happy','food','energy','clean'].forEach(x=>{
      c.pet[x]=Number.isFinite(Number(c.pet[x]))
        ?Number(c.pet[x])
        :b.pet[x];
    });

    c.pet.name=c.pet.name||b.pet.name;
    c.pet.emoji=c.pet.emoji||b.pet.emoji;
    c.pet.accessory=c.pet.accessory||b.pet.accessory;

    c.academy=Object.assign({},b.academy,c.academy||{});

    /* Si existía la antigua Academia global,
       conservamos esos datos. */
    if(d.lang && k===d.child){

      if(d.lang.language)
        c.academy.language=d.lang.language;

      if(Number.isFinite(Number(d.lang.xp)))
        c.academy.xp=Number(d.lang.xp);

      if(Number.isFinite(Number(d.lang.streak)))
        c.academy.streak=Number(d.lang.streak);
    }

    c.academy.xp=Number(c.academy.xp)||0;
    c.academy.streak=Number(c.academy.streak)||1;
    c.academy.weeklyDone=Number(c.academy.weeklyDone)||0;
    c.academy.weeklyGoal=Number(c.academy.weeklyGoal)||5;
    c.academy.lesson=Number(c.academy.lesson)||0;
    c.academy.challenge=Number(c.academy.challenge)||0;
    c.academy.language=c.academy.language||'Inglés';
    c.academy.level=c.academy.level||'Nivel 1';

    d.kids[k]=c;
  });

  d.pin=/^\d{4}$/.test(String(d.pin||''))
    ?String(d.pin)
    :base.pin;

  d.reward=String(d.reward||base.reward);

  d.child=d.kids[d.child]
    ?d.child
    :base.child;

  d.taskTips=Object.assign(
    {},
    base.taskTips||{},
    d.taskTips||{}
  );

  d.missions=Array.isArray(d.missions)
    ?d.missions
    :base.missions;

  d.missions=d.missions.map((m,i)=>{

    const b=base.missions[i%base.missions.length];

    return Object.assign(
      {},
      b,
      m,
      {
        id:m.id||Date.now()+i,
        n:m.n||m.name||b.n,
        d:m.d||b.d,
        t:m.t||b.t,
        s:Number(m.s)||b.s,
        i:m.i||b.i,
        done:Boolean(m.done)
      }
    );

  });

  d.history=Array.isArray(d.history)
    ?d.history
    :[];

  return d;
}

function fmt(t){

  let [h,m]=t.split(':').map(Number);

  return (h%12||12)+':'+
    String(m).padStart(2,'0')+
    ' '+
    (h>=12?'PM':'AM');

}

function ageGroup(age){

  if(age<=7)return 'Inicial';

  if(age<=12)return 'Primaria';

function petClass(emoji){

  if(emoji==='🐶')return 'dog';
  if(emoji==='🐱')return 'cat';
  if(emoji==='🐰')return 'rabbit';
  if(emoji==='🦊')return 'fox';
  if(emoji==='🐼')return 'panda';

  return 'cat';

}

function accessoryClass(a){

  return (
    a==='🕶️'||
    a==='👓'
  )
    ?'glasses'
    :'';

}

  const c=C();

  if(!m||m.done)return;

  m.done=true;

  c.stars+=m.s;

  c.streak=Math.max(c.streak,1);

  c.ach++;

  c.pet.happy=Math.min(100,c.pet.happy+3);

  D.history.unshift({

    kid:D.child,

    text:'Completó '+m.n,

    stars:m.s,

    date:new Date().toLocaleString()

  });

  save();

  home();

  showToast(`¡${m.n} completada! +${m.s} ⭐`);

  showPetBubble(
    '¡Misión completada! 🎉',
    `¡Muy bien, ${c.name}! ${getTaskTip(m)} 🐾`,

function answerSubject(subject,index,answer){

  const questions=subjectQuestions[subject];

  const q=questions[index];

  const buttons=
    document.querySelectorAll('.answer-btn');

  buttons.forEach(x=>x.disabled=true);

  if(answer===q.c){

    buttons[answer].classList.add('correct');

    C().stars+=1;

    C().academy.xp+=10;

    C().academy.weeklyDone=
      Math.min(
        C().academy.weeklyGoal,
        C().academy.weeklyDone+1
      );

    save();

    document.getElementById('subjectFeedback').innerHTML=`

      <div class="feedback ok">

        ✅ ¡Correcto! +10 XP y ⭐1

        <br>

        ${q.explain}

      </div>

      <button
        class="btn purple full"
        style="margin-top:10px"
        onclick="startSubject('${subject}')">

        Siguiente pregunta →

      </button>

    `;

  }else{

    buttons[answer].classList.add('wrong');

    buttons[q.c].classList.add('correct');

    document.getElementById('subjectFeedback').innerHTML=`

      <div class="feedback no">

        💡 Todavía estamos aprendiendo.

        <br>

        La respuesta correcta es:
        <b>${q.a[q.c]}</b>

        <br>

        ${q.explain}

      </div>

      <button
        class="btn purple full"
        style="margin-top:10px"
        onclick="startSubject('${subject}')">

        Intentar otra →

      </button>

    `;

  }

}

function petMood(p){

  const avg=
    (p.happy+p.food+p.energy+p.clean)/4;

  if(avg>80)
    return '🥰 ¡Estoy feliz y bien cuidada!';

  if(avg>55)
    return '🙂 Necesito un poquito de atención.';

  return '😟 ¡No me olvides! Necesito cuidados.';

}

function care(type){

  const p=C().pet;

  if(type==='food')
    p.food=Math.min(100,p.food+16);

  if(type==='clean')
    p.clean=Math.min(100,p.clean+16);

  if(type==='play'){

    p.happy=Math.min(100,p.happy+12);

    p.energy=Math.max(0,p.energy-5);

  }

  if(type==='walk'){

    p.happy=Math.min(100,p.happy+10);

    p.energy=Math.max(0,p.energy-8);

  }

  p.happy=Math.min(100,p.happy+3);

  save();

  pet();

  showPetBubble(
    '🐾 ¡Gracias!',
    '¡Me siento mucho mejor! Gracias por cuidarme. 💕',
    '❤️'
  );

function pin(x){

  if(x==='×'){

    pinUI();

    return;

  }

  if(x==='⌫'){

    pinIn=pinIn.slice(0,-1);

  }else if(pinIn.length<4){

    pinIn+=x;

  }

  document.getElementById('dots').textContent=
    '• '.repeat(pinIn.length)+
    '○ '.repeat(4-pinIn.length);

  if(pinIn.length===4){

    if(pinIn===D.pin){

      dashboard();

    }else{

      showToast('❌ Clave incorrecta');

      setTimeout(pinUI,500);

    }

  }

}

function saveTaskTip(id){

  const value=
    document
      .getElementById('tip-'+id)
      .value
      .trim();

  D.taskTips[id]=value;

  save();

  showToast('💬 Consejo personalizado guardado');

}

function toggleMission(id){

  const m=
    D.missions.find(x=>x.id===id);

  if(m){

    m.done=!m.done;

    save();

    manage();

  }

}

function addMission(){

  const n=
    document
      .getElementById('mn')
      .value
      .trim();

  if(!n){

    showToast('Escribe el nombre de la misión.');

    return;

  }

  const id=Date.now();

  D.missions.push({

    id:id,

    n:n,

    d:
      document
        .getElementById('md')
        .value
        .trim()||
      'Misión personalizada',

    t:
      document
        .getElementById('mt')
        .value||
      '17:00',

    s:+document
      .getElementById('ms')
      .value,

    i:'✨',

    done:false

  });

  D.taskTips[id]=
    document
      .getElementById('mTip')
      .value
      .trim();

  save();

  manage();

}

    Number(

        .value

  const reason=
    document
      .getElementById('starReason')
      .value
      .trim()||
    'Acción especial';

    kid:kid,

    text:reason,

    stars:n,

    date:new Date().toLocaleString()

  });

  save();

  showToast(`⭐ +${n} estrellas para ${D.kids[kid].name}`);

  dashboard();

}

let toastTimer;

function showToast(text){

  const toast=
    document.getElementById('toast');

  toast.textContent=text;

  toast.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer=
    setTimeout(()=>{
      toast.classList.remove('show');
    },2600);

}
