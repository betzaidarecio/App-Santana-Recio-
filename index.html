<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191a20">
<title>Mis Pequeñas Misiones</title>

<style>
:root{
 --pink:#ec5b89;
 --pink2:#f6a4bc;
 --purple:#7953bd;
 --yellow:#ffd83d;
 --green:#21a789;
 --blue:#56aee8;
 --orange:#f59b42;
 --ink:#403647;
 --muted:#7c747d;
 --bg:#fbf7fb;
 --line:#e9dfe8;
 --card:#fff;
 --soft:#fff2f7;
 --shadow:0 5px 20px rgba(50,30,60,.08)
}

*{
 box-sizing:border-box
}

html,body{
 margin:0;
 padding:0;
 min-height:100%;
 background:#191a20;
 color:var(--ink);
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select{
 font:inherit
}

button{
 cursor:pointer
}

button:disabled{
 cursor:not-allowed;
 opacity:.85
}

.app{
 max-width:720px;
 min-height:100vh;
 margin:auto;
 background:linear-gradient(#fffafd,#faf7fb);
 padding-bottom:92px;
 overflow:hidden
}

.topbar{
 height:58px;
 background:#191a20;
 color:white;
 display:flex;
 align-items:center;
 padding:0 18px;
 font-weight:800;
 font-size:18px
}

.header{
 background:#fffafd;
 border-bottom:1px solid var(--line);
 padding:20px 24px 18px;
 display:flex;
 align-items:center;
 justify-content:space-between
}

.brand{
 display:flex;
 align-items:center;
 gap:13px
}

.brand .star{
 font-size:54px;
 line-height:1
}

.brand h1{
 font-size:28px;
 margin:0 0 2px;
 letter-spacing:-.6px
}

.brand p{
 margin:0;
 color:#817985;
 font-size:16px
}

.iconbtn{
 border:0;
 background:white;
 border-radius:22px;
 width:58px;
 height:58px;
 box-shadow:var(--shadow);
 font-size:29px
}

main{
 padding:16px 18px
}

.child-tabs{
 display:flex;
 gap:8px;
 overflow:auto;
 margin:0 0 14px;
 scrollbar-width:none
}

.child-tabs::-webkit-scrollbar{
 display:none
}

.child-tab{
 border:1px solid var(--line);
 background:#fff;
 border-radius:18px;
 padding:10px 15px;
 min-width:108px;
 font-weight:800;
 color:var(--muted)
}

.child-tab.active{
 background:#fff0f6;
 border:2px solid var(--pink);
 color:var(--pink)
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:25px;
 box-shadow:var(--shadow);
 padding:17px;
 margin:12px 0
}

.profile{
 display:flex;
 gap:16px;
 align-items:center;
 background:linear-gradient(135deg,#fff,#fff1f7);
 padding:19px
}

.avatar{
 width:94px;
 height:94px;
 border-radius:28px;
 background:#eee4ff;
 display:grid;
 place-items:center;
 font-size:59px;
 flex:none
}

.profile h2{
 margin:0;
 font-size:28px
}

.profile .age{
 color:var(--muted);
 font-size:17px;
 margin:2px 0 10px
}

.chips{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.chip{
 background:#fff;
 border:1px solid var(--line);
 border-radius:18px;
 padding:7px 11px;
 font-weight:800;
 font-size:14px
}

.section-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:8px
}

.section-head h2{
 margin:0;
 font-size:23px
}

.outline{
 border:1px solid var(--line);
 background:#fff;
 border-radius:16px;
 padding:11px 16px;
 font-weight:800
}

.banner{
 background:linear-gradient(135deg,#ffe889,#fff3c5);
 border:1px solid #efd66a;
 border-radius:21px;
 padding:14px;
 text-align:center;
 font-weight:900;
 font-size:16px
}

.banner span{
 font-size:29px;
 margin-left:10px
}

.learn-card{
 background:linear-gradient(135deg,#f5edff,#fff)
}

.pill{
 display:inline-block;
 background:#eee5fb;
 color:#6b46a7;
 border-radius:16px;
 padding:6px 10px;
 font-size:12px;
 font-weight:800
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.tile{
 background:#fff;
 border:1px solid var(--line);
 border-radius:19px;
 padding:15px;
 text-align:left
}

.tile .ico{
 font-size:28px
}

.tile strong{
 display:block;
 margin-top:5px
}

.tile small{
 color:var(--muted)
}

.mission{
 display:grid;
 grid-template-columns:52px 1fr 44px;
 gap:12px;
 align-items:center;
 padding:13px 0;
 border-bottom:1px solid #eee
}

.mission:last-child{
 border-bottom:0
}

.mi{
 width:52px;
 height:52px;
 border-radius:18px;
 background:#fff4bd;
 display:grid;
 place-items:center;
 font-size:29px
}

.mission h3{
 margin:0;
 font-size:17px
}

.mission p{
 margin:2px 0 0;
 color:var(--muted);
 font-size:14px
}

.meta{
 color:var(--green);
 font-weight:800;
 font-size:13px;
 margin-top:5px
}

.plus,.check{
 width:43px;
 height:43px;
 border:0;
 border-radius:50%;
 font-weight:900;
 font-size:25px
}

.plus{
 background:#eaf8f4;
 color:var(--green)
}

.check{
 background:#dff6ed;
 color:var(--green)
}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(720px,100%);
 height:82px;
 background:#fff;
 border-top:1px solid var(--line);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 z-index:20
}

.bottom button{
 border:0;
 background:white;
 color:#746d75;
 font-size:12px;
 padding:6px
}

.bottom b{
 display:block;
 font-size:25px;
 margin-bottom:2px
}

.bottom .active{
 color:var(--pink);
 font-weight:900
}

.btn{
 border:0;
 border-radius:15px;
 padding:12px 15px;
 background:var(--pink);
 color:white;
 font-weight:900

.btn.purple{background:var(--purple)}
.btn.yellow{background:var(--yellow);color:#654d00}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.orange{background:var(--orange)}

.full{

/* APRENDER */

.subject-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px

.subject{
 border:2px solid var(--line);
 border-radius:22px;
 background:#fff;
 padding:18px;
 text-align:left

.subject.selected{

.subject .bigico{
 font-size:38px
}

.subject strong{

 font-size:19px;

.subject small{
 color:var(--muted)

.question{
 background:#f8f4ff;
 border-radius:22px;
 padding:20px;
 margin-top:14px

.question h2{
 margin-top:10px

.question-answer{

 font-weight:900;
 margin:16px 0

.option{
 width:100%;
 border:1px solid var(--line);
 background:#fff;
 border-radius:16px;
 padding:14px;
 margin:7px 0;
 text-align:left;
 font-weight:800

 background:#dff6ed;

}

.option.wrong{
 background:#ffe1e9;
 border-color:var(--pink);

}

.feedback{

 border-radius:15px;
 margin-top:10px;

.feedback.good{

 color:#087b5f
}

.feedback.bad{

 color:#a52d55
}

 padding:12px;
 font-weight:900;
 margin-top:12px
}

.listen-row{

 grid-template-columns:1fr 1fr;

 height:250px;

 align-items:center;
 justify-content:center
}

 font-size:145px;
 line-height:1;
 z-index:1;
 user-select:none;
 transition:transform .25s ease
}

.pet-accessory{
 position:absolute;
 z-index:3;
 pointer-events:none;
 user-select:none;
 line-height:1;
 transition:transform .25s ease
}

.acc-glasses{
 top:87px;
 left:50%;
 transform:translateX(-50%);
 font-size:57px
}

.acc-hat{
 top:12px;
 left:50%;
 transform:translateX(-50%);
 font-size:73px
}

.acc-bow{
 top:70px;
 right:44px;
 font-size:51px
}

.acc-crown{
 top:3px;
 left:50%;
 transform:translateX(-50%);
 font-size:60px
}

.acc-scarf{
 bottom:27px;
 left:50%;
 transform:translateX(-50%);
 font-size:59px
}

.acc-butterfly{
 top:47px;
 right:38px;
 font-size:47px
}

.acc-sparkles{
 top:22px;
 left:30px;
 font-size:48px
}

.acc-none{
 display:none
}

.petname{
 text-align:center;
 font-size:21px;
 font-weight:900
}

.pet-mood{
 text-align:center;
 font-size:16px;
 margin:6px 0
}

.bar{
 margin:9px 0
}

.barline{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 font-weight:800
}

.meter{
 height:10px;
 border-radius:20px;
 background:#eee;
 overflow:hidden
}

.meter i{
 display:block;
 height:100%;
 background:linear-gradient(90deg,var(--green),var(--yellow))
}

.accessory-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px
}

.accessory-btn{
 border:1px solid var(--line);
 background:white;
 border-radius:17px;
 padding:12px 5px;
 font-size:30px
}

.accessory-btn small{
 display:block;
 font-size:10px;
 font-weight:800;
 color:var(--muted)
}

/* ANIMACIONES */

.pet-action .pet-body{
 animation:petBounce .8s ease-in-out 2
}

.pet-fly .pet-body{
 animation:petFly 1.5s ease-in-out 1
}

.pet-run .pet-body{
 animation:petRun 1.1s ease-in-out 1
}

.pet-hop .pet-body{
 animation:petHop .8s ease-in-out 2
}

.pet-spin .pet-body{
 animation:petSpin 1s ease-in-out 1
}

.pet-swim .pet-body{
 animation:petSwim 1.2s ease-in-out 1
}

@keyframes petBounce{
 0%,100%{transform:translateY(0) scale(1)}
 50%{transform:translateY(-35px) scale(1.05)}
}

@keyframes petFly{
 0%{transform:translate(0,0) rotate(0)}
 35%{transform:translate(70px,-35px) rotate(-8deg)}
 70%{transform:translate(-55px,-15px) rotate(8deg)}
 100%{transform:translate(0,0) rotate(0)}
}

@keyframes petRun{
 0%{transform:translateX(0)}
 35%{transform:translateX(70px)}
 70%{transform:translateX(-60px)}
 100%{transform:translateX(0)}
}

@keyframes petHop{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-45px)}
}

@keyframes petSpin{
 0%{transform:rotate(0)}
 50%{transform:rotate(15deg) scale(1.08)}
 100%{transform:rotate(0)}
}

@keyframes petSwim{
 0%,100%{transform:translateX(0)}
 50%{transform:translateX(35px) rotate(-5deg)}
}

/* RECORDATORIO */

.pet-reminder{
 position:fixed;
 inset:0;
 background:rgba(25,20,30,.55);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:100;
 padding:20px
}

.pet-reminder.show{

.reminder-box{
 position:relative;
 width:min(440px,100%);
 background:white;
 border-radius:30px;
 padding:25px;
 text-align:center;
 box-shadow:0 20px 70px rgba(0,0,0,.3);
 overflow:hidden
}

.reminder-pet{
 font-size:110px;
 margin:5px auto;
 animation:reminderPet 1.2s ease-in-out infinite
}

@keyframes reminderPet{
 0%,100%{transform:translateY(0) rotate(-3deg)}
 50%{transform:translateY(-15px) rotate(3deg)}
}

.reminder-close{
 position:absolute;
 top:12px;
 right:12px;
 border:0;
 background:#f5edf6;
 border-radius:50%;
 width:40px;
 height:40px;
 font-size:23px
}

/* MODALES */

.modal{
 position:fixed;
 inset:0;
 background:rgba(25,20,30,.6);
 display:none;
 align-items:flex-end;
 z-index:50
}

.modal.show{
 display:flex
}

.sheet{
 width:min(720px,100%);
 max-height:92vh;
 overflow:auto;
 background:#fff;
 border-radius:28px 28px 0 0;
 padding:22px
}

.close{
 float:right;
 border:0;
 background:#f5edf6;
 border-radius:50%;
 width:40px;
 height:40px;
 font-size:23px
}

.reward{
 position:fixed;
 inset:0;
 background:rgba(30,20,35,.72);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:80
}

.reward.show{
 display:flex
}

.rewardbox{
 background:#fff;
 border-radius:32px;
 text-align:center;
 padding:26px;
 width:min(500px,100%);
 box-shadow:0 20px 60px #0005
}

.bigstar{
 font-size:140px;
 line-height:1;
 animation:starPulse 1s ease-in-out infinite
}

@keyframes starPulse{
 50%{transform:scale(1.08)}
}

input,select{
 width:100%;
 padding:12px;
 border:1px solid var(--line);
 border-radius:13px;
 margin:5px 0 10px;
 background:#fff;
 color:var(--ink)
}

label{
 font-size:12px;
 font-weight:900
}

.status{
 padding:10px;
 border-radius:14px;
 background:#f4edf8;
 margin-top:10px;
 font-weight:700
}

.voice-status{
 text-align:center;
 margin-top:8px;
 font-size:13px;

}

@media(max-width:520px){

 .brand h1{font-size:25px}
 .brand .star{font-size:48px}

 .avatar{
   width:86px;
   height:86px;
   font-size:53px
 }

 .subject-grid{
   grid-template-columns:1fr 1fr
 }

 .pet-stage{
   width:250px
 }
}
</style>
</head>

/* ==========================================================
   CARGA Y MIGRACIÓN
========================================================== */

function cloneInitial(){

 return JSON.parse(
  JSON.stringify(initial)
 );

}

function normalizeData(raw){

 const d=
  raw&&typeof raw==='object'
   ?raw
   :cloneInitial();

 const base=cloneInitial();

 if(!d.kids||typeof d.kids!=='object'){
  d.kids=base.kids;
 }

 Object.keys(base.kids).forEach(k=>{

  const b=base.kids[k];
  const c=d.kids[k]||{};

  c.name=c.name||b.name;
  c.age=Number(c.age)||b.age;
  c.level=Number(c.level)||b.level;

  c.stars=
   Number.isFinite(Number(c.stars))
    ?Number(c.stars)
    :b.stars;

  c.streak=
   Number.isFinite(Number(c.streak))
    ?Number(c.streak)
    :b.streak;

  c.ach=
   Number.isFinite(Number(c.ach))
    ?Number(c.ach)
    :b.ach;

  c.avatar=c.avatar||b.avatar;

  c.pet=Object.assign({},b.pet,c.pet||{});

  ['happy','food','energy','clean'].forEach(x=>{

   c.pet[x]=
    Number.isFinite(Number(c.pet[x]))
     ?Number(c.pet[x])
     :b.pet[x];

  });

  c.pet.name=
   c.pet.name||b.pet.name;

  c.pet.emoji=
   c.pet.emoji||b.pet.emoji;

  if(typeof c.pet.accessory!=='string'){
   c.pet.accessory='';
  }

  c.learningLanguage=
   c.learningLanguage||
   b.learningLanguage||
   'ingles';

  d.kids[k]=c;

 });

 d.pin=
  /^\d{4}$/.test(String(d.pin||''))
   ?String(d.pin)
   :base.pin;

 d.reward=
  String(d.reward||base.reward);

 d.child=
  d.kids[d.child]
   ?d.child
   :base.child;

 d.missions=
  Array.isArray(d.missions)
   ?d.missions
   :base.missions;

 d.history=
  Array.isArray(d.history)
   ?d.history
   :[];

 return d;

}

let D;

try{

  localStorage.getItem(KEY)||
  localStorage.getItem('MPM5_FINAL_DATA')||

 );

 localStorage.setItem(

/* ==========================================================
   UTILIDADES SEGURAS
========================================================== */

function esc(t){

 return String(t??'')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}

function escapeAttr(t){

 return String(t??'')
  .replace(/\\/g,'\\\\')
  .replace(/'/g,"\\'");
}

function normalizeAnswer(t){

 return String(t||'')
  .toLowerCase()
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .replace(/[¿?¡!.,]/g,'')
  .replace(/\s+/g,' ')
  .trim();

}

function fmt(t){

 if(!t)return'';

 let parts=t.split(':');

 let h=Number(parts[0]);
 let m=Number(parts[1]);

 return(
  (h%12||12)+':'+
  String(m).padStart(2,'0')+
  ' '+
  (h>=12?'PM':'AM')
 );

}

========================================================== */

/*
 No depende de archivos externos.
 Crea pequeños sonidos mediante Web Audio.
 */

function playPetSound(emoji){

 try{

  const AudioContext=
   window.AudioContext||
   window.webkitAudioContext;

  if(!AudioContext)return;

  const ctx=new AudioContext();

  const now=ctx.currentTime;

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  let f1=440;
  let f2=600;
  let duration=.22;

  if(emoji==='🐶'){
   f1=280;
   f2=190;
   duration=.18;
  }

  else if(emoji==='🐱'){
   f1=700;
   f2=950;
   duration=.28;
  }

  else if(emoji==='🐰'){
   f1=500;
   f2=750;
   duration=.15;
  }

  else if(emoji==='🦜'){
   f1=900;
   f2=1250;
   duration=.22;
  }

  else if(emoji==='🐢'){
   f1=250;
   f2=300;
   duration=.3;
  }

  else if(emoji==='🐹'){
   f1=650;
   f2=800;
   duration=.18;
  }

  else if(emoji==='🦊'){
   f1=380;
   f2=500;
   duration=.2;
  }

  else if(emoji==='🐼'){
   f1=330;
   f2=430;
   duration=.22;
  }

  osc.frequency.setValueAtTime(f1,now);
  osc.frequency.linearRampToValueAtTime(f2,now+duration);

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.12,now+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

  osc.start(now);
  osc.stop(now+duration+.03);

  setTimeout(()=>{
   try{ctx.close()}catch(e){}
  },500);

 }catch(e){

  console.log(
   'Audio de mascota no disponible',
   e
  );

 }

}

let currentSubject='espanol';
let currentQuestion=null;
let questionIndex=0;
let answered=false;
let lastQuestionBySubject={};

function randomQuestion(subject){

 const list=
  Array.isArray(questionBank[subject])
   ?questionBank[subject]
   :[];

 if(!list.length)return null;

 let q;

 if(list.length===1){
  q=list[0];
 }else{

  let attempts=0;

  do{

   q=
    list[
     Math.floor(
      Math.random()*list.length
     )
    ];

   attempts++;

  }while(
   lastQuestionBySubject[subject]&&
   q.q===lastQuestionBySubject[subject].q&&
   attempts<20
  );

 }

 lastQuestionBySubject[subject]=q;

 return q;

}

function answerQuestion(index){

 if(answered)return;

 const q=currentQuestion;

 if(!q)return;

 const selected=
  q.options[index];

 const correct=
  normalizeAnswer(selected)===
  normalizeAnswer(q.answer);

 const buttons=
  document.querySelectorAll('.option');

 buttons.forEach((b,i)=>{

  b.disabled=true;

  if(i===index){

   b.classList.add(
    correct?'correct':'wrong'
   );

  }

  if(
   normalizeAnswer(q.options[i])===
   normalizeAnswer(q.answer)
  ){

   b.classList.add('correct');

  }

 });

 answered=true;

 const feedback=
  document.getElementById('feedback');

 if(!feedback)return;

 if(correct){

  const c=C();

  /*

  c.stars+=1;

  D.history.unshift({

   kid:D.child,

function speakText(text,lang='en-US',rate=.85){

 if(
  !('speechSynthesis' in window)
 ){

  alert(
   'El navegador de este teléfono no permite reproducir voz.'
  );

  return false;

 }

 try{

  window.speechSynthesis.cancel();

  const u=
   new SpeechSynthesisUtterance(
    String(text)
   );

  u.lang=lang;
  u.rate=rate;
  u.pitch=1;

  /*
   Esperamos un pequeño momento para
   que Android cargue las voces.
  */

  setTimeout(()=>{

   try{
    window.speechSynthesis.speak(u);
   }catch(e){
    console.error(e);
   }

  },80);

  return true;

 }catch(e){

  console.error(e);

  alert(
   'No se pudo reproducir el audio.'
  );

  return false;

 }

}

function speakEnglish(text){

 return speakText(
  text,
  'en-US',
  .78
 );

}


/* ==========================================================

========================================================== */

let activeRecognition=null;

function startEnglishMic(){

 const Recognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

 if(!Recognition){

  alert(
   'El reconocimiento de voz no está disponible en este navegador. '+
   'Prueba Chrome en Android y permite el micrófono.'
  );

  return;

 }

 const q=currentQuestion;

 if(
  !q||
  currentSubject!=='ingles'||
  !q.speak
 ){

  return;

 }

 if(activeRecognition){

  try{
   activeRecognition.stop();
  }catch(e){}

  activeRecognition=null;

 }

 const r=new Recognition();

 activeRecognition=r;

 r.lang='en-US';
 r.interimResults=false;
 r.maxAlternatives=3;
 r.continuous=false;

 const status=
  document.getElementById('micStatus');

 if(status){

  status.textContent=
   '🎤 Escuchando... habla ahora.';

 }

 try{

  r.onstart=function(){

   if(status){

    status.textContent=
     '🎤 ¡Te estoy escuchando! Di la palabra en inglés.';

   }

  };

  r.onresult=function(event){

   const results=
    event.results[0];

   let best='';

   for(let i=0;i<results.length;i++){

    if(
     results[i].confidence>
     (best?0:0)
    ){
     best=results[i].transcript;
    }

   }

   best=
    best||
    results[0]?.transcript||
    '';

   const said=
    String(best).trim();

   const target=
    String(q.speak).trim();

   /*
    La pronunciación debe coincidir
    realmente con la palabra/frase.
   */

   const ok=
    normalizeAnswer(said)===
    normalizeAnswer(target);

   if(status){

    status.innerHTML=
     ok

      ?'🎉 ¡Muy bien! La pronunciación coincide.'

      :'❌ Escuché: “'+
       esc(said)+
       '”. Intenta nuevamente.';

   }

   /*
    IMPORTANTE:
    NO se suman estrellas por simplemente
    tocar el micrófono.
   */

   if(ok){

    const c=C();

    c.stars+=1;

    D.history.unshift({

     kid:D.child,

     text:
      'Pronunció correctamente: '+
      target,

     stars:1,

     date:new Date().toLocaleString()

    });

    save();

    if(status){

     status.innerHTML+=
      '<br><b>⭐ +1 estrella</b>';

    }

   }

  };

  r.onerror=function(event){

   console.error(
    'SpeechRecognition:',
    event
   );

   if(status){

    if(
     event.error==='not-allowed'||
     event.error==='service-not-allowed'
    ){

     status.innerHTML=
      '🔒 El micrófono está bloqueado. '+
      'Permite el micrófono para este sitio en los ajustes del navegador.';

    }

    else if(event.error==='no-speech'){

     status.textContent=
      '😕 No escuché ninguna palabra. '+
      'Pulsa Hablar e inténtalo otra vez.';

    }

    else{

     status.textContent=
      '⚠️ No pude escuchar. Intenta nuevamente.';

    }

   }

  };

  r.onend=function(){

   activeRecognition=null;

   if(
    status&&
    status.textContent.includes('Escuchando')
   ){

    status.textContent=
     '🎤 Micrófono terminado.';

   }

  };

  r.start();

 }catch(e){

  console.error(e);

  activeRecognition=null;

  if(status){

   status.textContent=
    '⚠️ No se pudo activar el micrófono.';

  }

 }

}

   '¿Cuántas estrellas? 1, 2, 3 o 5',
   '3'
  )
 );

 if(![1,2,3,5].includes(n))
  return;

 let reason=
  prompt(
   'Motivo',
   'Ayudó sin que se lo pidieran'
  )||
  'Acción extra';

 D.kids[k].stars+=n;

 D.history.unshift({

  kid:k,

  text:reason,

  stars:n,

  date:new Date().toLocaleString()

 });

 save();

 dashboard();

}

function manage(){

 document.getElementById('sheet').innerHTML=

 `<button
  class="close"
  onclick="dashboard()">

  ←

 </button>

 <h2>📅 Misiones y horarios</h2>

 ${
  D.missions.map(m=>`

  <div class="mission">

   <div class="mi">
    ${esc(m.i)}
   </div>

   <div>

    <h3>${esc(m.n)}</h3>

    <p>${esc(m.d)}</p>

    <div class="meta">
     ${fmt(m.t)} · ⭐${m.s}
    </div>

   </div>

   <button
    class="${m.done?'check':'plus'}"
    onclick="toggleMission(${Number(m.id)})">

    ${m.done?'✓':'+'}

   </button>

  </div>

 `).join('')
 }

 <section class="card">

  <h3>➕ Agregar nueva misión</h3>

  <label>Nombre</label>

  <input
   id="mn"
   placeholder="Ej. Leer 20 minutos">

  <label>Hora</label>

  <input
   id="mt"
   type="time"
   value="17:00">

  <label>Estrellas</label>

  <select id="ms">

   <option value="1">1</option>
   <option value="2">2</option>
   <option value="3">3</option>
   <option value="5">5</option>

  </select>

  <button
   class="btn full"
   onclick="addMission()">

   Agregar misión

  </button>

 </section>

 `;

}

function toggleMission(id){

 const m=
  D.missions.find(
   x=>Number(x.id)===Number(id)
  );

 if(m){

  m.done=!m.done;

  save();

  manage();

 }

}

function addMission(){

 const n=
  document.getElementById('mn')
   ?.value.trim();

 if(!n)return;

 const time=
  document.getElementById('mt')
   ?.value||'17:00';

 const stars=
  Number(
   document.getElementById('ms')
    ?.value||2
  );

 D.missions.push({

  id:Date.now(),

  n:n,

  d:'Misión personalizada',

  t:time,

  s:stars,

  i:'✨',

  done:false

 });

 save();

 manage();

}

function progress(){

 document.getElementById('sheet').innerHTML=

 `<button
  class="close"
  onclick="dashboard()">

  ←

 </button>

 <h2>📊 Progreso de los niños</h2>

 ${
  Object.values(D.kids).map(c=>`

  <section class="card">

   <h3>
    ${esc(c.avatar)}
    ${esc(c.name)}
   </h3>

   <p>
    ⭐ ${c.stars} ·
    🔥 ${c.streak} días ·
    Nivel ${c.level}
   </p>

   <label>
    Progreso de nivel
   </label>

   <div class="meter">

    <i
     style="
      width:${(c.stars*3)%100}%
     ">
    </i>

   </div>

  </section>

 `).join('')
 }

 `;

}

function history(){

 document.getElementById('sheet').innerHTML=

 `<button
  class="close"
  onclick="dashboard()">

  ←

 </button>

 <h2>🕘 Historial</h2>

 ${
  D.history.map(h=>`

   <section class="card">

    <b>

     ${esc(
      D.kids[h.kid]?.name||
      h.kid
     )}

     · ⭐${Number(h.stars)||0}

    </b>

    <p>
     ${esc(h.text)}
    </p>

    <small>
     ${esc(h.date)}
    </small>

   </section>

  `).join('')

  ||

  '<p>No hay movimientos.</p>'
 }

 `;

}


/* ==========================================================
   NOTIFICACIONES
========================================================== */

function requestNotifications(){

 if(!('Notification' in window)){

  alert(
   'Este navegador no permite notificaciones del sistema.'
  );

  return;

 }

 Notification.requestPermission()
  .then(permission=>{

   if(permission==='granted'){

    alert(
     '🔔 ¡Listo! Las notificaciones están activadas.'
    );

   }else{

    alert(
     'Las notificaciones no fueron permitidas.'
    );

   }

  })
  .catch(()=>{

   alert(
    'No fue posible activar las notificaciones.'
   );

  });

}

function notify(){

 const c=C();
 const p=c.pet;

 const pending=
  D.missions.filter(
   m=>!m.done
  );

 let message;

 if(pending.length){

  const m=pending[0];

  message=
   p.name+
   ' dice: “¡Ey, '+
   c.name+
   '! Acuérdate de: '+
   m.n+
   ' 🐾”';

 }else{

  message=
   p.name+
   ' dice: “¡Todo al día! ¿Jugamos juntos? 🐾”';

 }

 showReminder(
  p.emoji,
  '🔔 ¡Hey, '+c.name+'!',
  message
 );

 if(
  'Notification' in window&&
  Notification.permission==='granted'
 ){

  try{

   new Notification(
    '🐾 '+p.name+
    ' tiene un recordatorio',
    {
     body:message,
     icon:''
    }
   );

  }catch(e){}

 }

}

function showReminder(emoji,title,message){

 const box=
  document.getElementById('petReminder');

 const petEl=
  document.getElementById('reminderPet');

 const titleEl=
  document.getElementById('reminderTitle');

 const msgEl=
  document.getElementById('reminderMessage');

 if(!box)return;

 petEl.textContent=emoji||'🐾';

 titleEl.textContent=title||'🔔 ¡Ey!';

 msgEl.textContent=message||'';

 /*
  La mascota aparece en una posición
  visual diferente cada vez.
 */

 const positions=[
  'translateX(-15px)',
  'translateX(12px)',
  'translateY(-5px)',
  'translateX(0)'
 ];

 const pos=
  positions[
   Math.floor(
    Math.random()*positions.length
   )
  ];

 petEl.style.transform=pos;

 box.classList.add('show');

 playPetSound(emoji);

}

function closeReminder(){

 document
  .getElementById('petReminder')
  .classList.remove('show');

}


/* ==========================================================
   RECORDATORIO AUTOMÁTICO
========================================================== */

function automaticReminder(){

 const pending=
  D.missions.filter(
   m=>!m.done
  );

 if(!pending.length)return;

 /*
  Solo mostramos un recordatorio automático
  ocasionalmente, no cada segundo.
 */

 const now=Date.now();

 const last=
  Number(
   localStorage.getItem(
    'MPM_LAST_REMINDER'
   )||0
  );

 if(
  now-last<
  60*60*1000
 ){

  return;

 }

 localStorage.setItem(
  'MPM_LAST_REMINDER',
  String(now)
 );

 const c=C();
 const p=c.pet;
 const m=pending[0];

 showReminder(
  p.emoji,
  '🔔 ¡Acuérdate!',
  p.name+
   ' te recuerda: '+
   m.n+
   ' 🐾'
 );

}


/* ==========================================================
   RECOMPENSA
========================================================== */

function showReward(){

 document.getElementById('rewardText')
  .textContent=D.reward;

 document
  .getElementById('reward')
  .classList.add('show');

}

function closeReward(){

 document
  .getElementById('reward')
  .classList.remove('show');

}


/* ==========================================================
   ARRANQUE
========================================================== */

try{

 home();

 setTimeout(
  automaticReminder,
  1800
 );

}catch(error){

 console.error(
  'Error de arranque:',
  error
 );

 showRecovery();

}
