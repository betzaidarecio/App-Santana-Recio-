<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191a20">
  <title>Mis Pequeñas Misiones 6.0</title>
  <style>
    :root {
      --p: #ec5b89;
      --v: #7953bd;
      --g: #21a789;
      --y: #ffd83d;
      --ink: #403647;
      --muted: #7c747d;
      --line: #e9dfe8;
      --bg: #191a20;
      --card-bg: #ffffff;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .app {
      max-width: 720px;
      min-height: 100vh;
      margin: auto;
      background: linear-gradient(#fffafd, #faf7fb);
      padding-bottom: 88px;
      position: relative;
      overflow: hidden;
    }

    .top {
      height: 58px;
      background: #191a20;
      color: #fff;
      padding: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
    }

    .head {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fffafd;
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .brand b {
      font-size: 20px;
      display: block;
    }

    .brand small {
      display: block;
      color: #817985;
      font-size: 12px;
    }

    .bell {
      border: 0;
      background: #fff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: grid;
      place-items: center;
    }

    main {
      padding: 15px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab, .outline {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 17px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      border: 2px solid var(--p);
      color: var(--p);
      background: #fff0f6;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 25px;
      padding: 17px;
      margin: 12px 0;
      box-shadow: 0 5px 20px #321e3c12;
    }

    .profile {
      display: flex;
      gap: 15px;
      align-items: center;
      background: linear-gradient(135deg, #fff, #fff1f7);
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 25px;
      background: #eee4ff;
      display: grid;
      place-items: center;
      font-size: 52px;
      flex-shrink: 0;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .chip, .pill {
      background: #eee5fb;
      border-radius: 15px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .mission {
      display: grid;
      grid-template-columns: 50px 1fr 42px;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .mi {
      width: 50px;
      height: 50px;
      border-radius: 17px;
      background: #fff4bd;
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    .mission h3 {
      margin: 0;
      font-size: 15px;
    }

    .mission p {
      margin: 2px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .meta {
      color: var(--g);
      font-size: 12px;
      font-weight: 800;
    }

    .plus, .check {
      border: 0;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
    }

    .plus { background: #eaf8f4; color: var(--g); }
    .check { background: #dff6ed; color: var(--g); }

    .banner {
      background: linear-gradient(135deg, #ffe889, #fff3c5);
      border: 1px solid #efd66a;
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      font-weight: 900;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 12px 15px;
      background: var(--p);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      margin-top: 8px;
    }

    .purple { background: var(--v); }
    .green { background: var(--g); }
    .yellow { background: var(--y); color: #654d00; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .tile {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
    }

    .tile .ico { font-size: 28px; }
    .tile strong { display: block; margin-top: 5px; }
    .tile small { color: var(--muted); }

    .pet { background: linear-gradient(135deg, #ecfaff, #fff); }
    .petface { text-align: center; font-size: 85px; position: relative; }
    .petname { text-align: center; font-size: 21px; font-weight: 900; }
    .status { text-align: center; font-weight: 800; }

    .bar { margin: 8px 0; }
    .barline { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; }
    .meter { height: 10px; background: #eee; border-radius: 20px; overflow: hidden; margin-top: 4px; }
    .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--p), var(--y)); }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, 100%);
      height: 80px;
      background: #fff;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 40;
    }

    .bottom button {
      border: 0;
      background: #fff;
      color: #746d75;
      font-size: 12px;
      cursor: pointer;
    }

    .bottom b { display: block; font-size: 24px; }
    .bottom .active { color: var(--p); font-weight: 900; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(25, 20, 30, 0.6);
      display: none;
      align-items: flex-end;
      z-index: 80;
    }

    .modal.show { display: flex; }

    .sheet {
      width: min(720px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 28px 28px 0 0;
      padding: 20px;
      margin: 0 auto;
    }

    .close {
      float: right;
      border: 0;
      background: #f5edf6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 22px;
      cursor: pointer;
    }

    .choice {
      width: 100%;
      padding: 13px;
      margin: 5px 0;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      text-align: left;
      font-weight: 700;
      cursor: pointer;
    }

    .choice.correct { background: #eaf8f4; border-color: var(--g); }
    .choice.wrong { background: #fff0f1; border-color: #e45867; }

    .feedback { padding: 13px; border-radius: 17px; margin-top: 10px; font-weight: 700; }
    .good { background: #eaf8f4; color: #167e68; }
    .bad { background: #fff0f1; color: #a83848; }

    .story { background: #fff3c9; border-radius: 18px; padding: 15px; line-height: 1.55; }
    
    /* CHAT: Estilos mejorados */
    .chat { background: #f7f2ff; border-radius: 20px; padding: 12px; min-height: 250px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;}
    .bubble { padding: 10px 13px; border-radius: 18px; max-width: 88%; word-break: break-word; font-size: 14px; position: relative; line-height: 1.4; }
    .bubble.pet { background: #fff; border: 1px solid #eadff3; align-self: flex-start; border-bottom-left-radius: 5px;}
    .bubble.me { background: var(--v); color: #fff; align-self: flex-end; border-bottom-right-radius: 5px;}

    .chatrow { display: flex; gap: 7px; margin-top: 12px; }
    .chatrow input { margin: 0; }
    
    /* Menú rápido dinámico */
    .quick { display: flex; gap: 7px; overflow-x: auto; margin: 8px 0; padding-bottom: 5px;}
    .quick button { white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 8px; cursor: pointer; font-size: 13px; color: var(--ink); font-weight: 600;}

    /* ANIMACIONES MODERNAS DE ANIMALES */
    .runner-animated {
      position: fixed;
      top: 50%;
      left: -120px;
      width: 100px;
      height: 100px;
      z-index: 60;
      animation: runRight 10s linear forwards;
      cursor: pointer;
      pointer-events: auto;
    }

    .runner-animated img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Movimiento de trote / marcha según especie */
    .runner-animated.trot { animation: runRight 10s linear forwards, bounce 0.4s infinite alternate ease-in-out; }
    .runner-animated.hop { animation: runRight 10s linear forwards, hop 0.6s infinite alternate ease-in-out; }
    .runner-animated.fly { animation: runFly 9s linear forwards, flyWave 1.2s infinite ease-in-out; }

    @keyframes runRight {
      0% { left: -120px; }
      100% { left: calc(100% + 120px); }
    }

    @keyframes runFly {
      0% { left: -120px; top: 60%; }
      50% { top: 25%; }
      100% { left: calc(100% + 120px); top: 55%; }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    @keyframes hop {
      0% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-28px) scaleY(1.05); }
      100% { transform: translateY(0) scaleY(0.95); }
    }

    @keyframes flyWave {
      0%, 100% { transform: translateY(0) rotate(2deg); }
      50% { transform: translateY(-15px) rotate(-4deg); }
    }

    .zzz {
      position: absolute;
      right: 20%;
      top: -5px;
      font-size: 20px;
      color: var(--v);
      animation: z 2s infinite;
    }

    @keyframes z {
      50% { transform: translateY(-12px); opacity: .4; }
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      margin: 5px 0 10px;
      font-family: inherit;
    }

    textarea { min-height: 80px; }

    .pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 10px; }
    .pin button { padding: 15px; border: 1px solid #efb3c7; background: #fff; border-radius: 20px; color: #d94e7d; font-weight: 900; font-size: 18px; cursor: pointer; }
    .dots { text-align: center; color: var(--p); font-size: 24px; margin: 10px 0; }

    .reward {
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 35, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .reward.show { display: flex; }
    .rewardbox { background: #fff; border-radius: 30px; padding: 25px; text-align: center; width: min(500px, 100%); }
    .bigstar { font-size: 100px; line-height: 1; }
  </style>
</head>
<body>

<div class="app">
  <div class="top">‹ &nbsp; Mis Pequeñas Misiones 6.0</div>
  <header class="head">
    <div class="brand">
      <span style="font-size:45px">⭐</span>
      <div>
        <b>Mis Pequeñas Misiones</b>
        <small>Pequeñas acciones, grandes hábitos</small>
      </div>
    </div>
    <button class="bell" onclick="notify()">🔔</button>
  </header>
  
  <main id="screen"></main>

  <nav class="bottom">
    <button id="n-home" class="active" onclick="go('home')"><b>🏠</b>Inicio</button>
    <button id="n-learn" onclick="go('learn')"><b>🎯</b>Aprender</button>
    <button id="n-prize" onclick="go('prize')"><b>🏆</b>Premios</button>
    <button id="n-pet" onclick="go('pet')"><b>🐾</b>Mascota</button>
    <button id="n-mom" onclick="openMom()"><b>🔐</b>Mamá</button>
  </nav>
</div>

<div id="modal" class="modal">
  <div id="sheet" class="sheet"></div>
</div>

<div id="reward" class="reward">
  <div class="rewardbox">
    <div class="bigstar">⭐</div>
    <h2>¡REGALO DESBLOQUEADO!</h2>
    <p id="rewardText"></p>
    <button class="btn" onclick="closeReward()">¡Genial! 🎉</button>
  </div>
</div>

<script>
const KEY = 'MPM5_FINAL_DATA';

// MAPA DE ANIMACIONES VECTORIALES SEGÚN ESPECIE
const PET_ANIMATIONS = {
  '🐶': { type: 'trot', url: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWd0YW83ZnR3dmsyeW11MHR3ZnF3bXpnbDR2cnlhNHJqcm9rbmE3ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/k8puvh6Y4tA3u/giphy.gif' },
  '🐱': { type: 'trot', url: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmE0YTRvMmhpbWZrdnpicndtbnpqb3U5NnI3cTl2aDV1OWVtbXgyYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VpXaaIeFfM7k0EicfN/giphy.gif' },
  '🐰': { type: 'hop', url: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjFua2ZtYmZlYXF2OXAydHRrNWhrMGQxaWZhbmd4a2J0bHRubTJxeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/jIn8yZzp2W73W/giphy.gif' },
  '🦊': { type: 'trot', url: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWZsbHRxZXZia2sxaHJnNGgwdWpsYzM5bzZ4eXRnOGt0MnpxOHp5OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26u4lOMA8JKSnL9Uk/giphy.gif' },
  '🐼': { type: 'hop', url: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXdtbmswbnBvdGlsZnYyeWhraHpza2NteGNmbXB5dTNvbW14emx2biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/Lp4LVeLV3w69q/giphy.gif' },
  '🦜': { type: 'fly', url: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdW4xdWpxdHQ3azdudWZ4dWxsazc2YXh1N3UyeDV2bWVucm0xOWdrZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/134VhmZDQ3v2mI/giphy.gif' }
};

const langs = {
  Inglés: ['🇺🇸', ['apple|manzana', 'school|escuela', 'friend|amigo', 'water|agua', 'book|libro', 'happy|feliz', 'house|casa', 'play|jugar', 'family|familia', 'garden|jardín', 'animal|animal']],
  Francés: ['🇫🇷', ['bonjour|hola', 'école|escuela', 'ami|amigo', 'eau|agua', 'livre|libro', 'heureux|feliz', 'maison|casa', 'jouer|jugar', 'famille|familia', 'jardin|jardín', 'animal|animal']],
  Portugués: ['🇧🇷', ['casa|casa', 'amigo|amigo', 'água|agua', 'livro|libro', 'feliz|feliz', 'escola|escuela', 'manhã|mañana', 'brincar|jugar', 'família|familia', 'jardim|jardín', 'animal|animal']],
  Italiano: ['🇮🇹', ['ciao|hola', 'scuola|escuela', 'amico|amigo', 'acqua|agua', 'libro|libro', 'felice|feliz', 'casa|casa', 'giocare|jugar', 'famiglia|familia', 'giardino|jardín', 'animale|animal']],
  Alemán: ['🇩🇪', ['hallo|hola', 'schule|escuela', 'freund|amigo', 'wasser|agua', 'buch|libro', 'glücklich|feliz', 'haus|casa', 'spielen|jugar', 'familie|familia', 'garten|jardín', 'tier|animal']],
  Japonés: ['🇯🇵', ['neko|gato', 'mizu|agua', 'tomodachi|amigo', 'gakkō|escuela', 'hon|libro', 'ureshii|feliz', 'ie|casa', 'asobu|jugar', 'kazoku|familia', 'niwa|jardín', 'dōbutsu|animal']]
};

const initial = {
  pin: '2580',
  reward: '¡Ganaste un helado! 🍦',
  child: 'violeta',
  lang: {
    language: 'Inglés',
    level: 'Básico',
    xp: 120,
    streak: 3,
    weekly: { practices: 0, words: 0, conversations: 0, stories: 0 }
  },
  kids: {
    violeta: { name: 'Violeta', age: 13, level: 7, stars: 48, streak: 6, ach: 4, avatar: '👧', pet: { emoji: '🐶', name: 'Luna', happy: 80, food: 78, energy: 88, clean: 92, healthy: true, toy: '🎾' } },
    eliseo: { name: 'Eliseo', age: 9, level: 5, stars: 42, streak: 8, ach: 3, avatar: '👦', pet: { emoji: '🐱', name: 'Milo', happy: 91, food: 85, energy: 90, clean: 88, healthy: true, toy: '🧶' } },
    misael: { name: 'Misael', age: 7, level: 3, stars: 38, streak: 4, ach: 2, avatar: '👦', pet: { emoji: '🐰', name: 'Nube', happy: 86, food: 80, energy: 92, clean: 93, healthy: true, toy: '🥕' } }
  },
  missions: [
    ['Alimentación saludable', 'Come frutas y toma agua', '13:00', 2, '🍎'],
    ['Dientes y baño', 'Cepíllate los dientes y báñate', '18:00', 2, '🪥'],
    ['Apagar luces y TV', 'Apaga lo que no se usa', '19:30', 2, '💡'],
    ['Prepararse para dormir', 'Pijama, dientes y a la cama', '20:30', 3, '🌙'],
    ['Ve a la escuela', 'Mochila lista y llegar a tiempo', '07:15', 2, '🎒'],
    ['Hora de limpiar', 'Ordena tus cosas y colabora en casa', '17:00', 2, '🧹'],
    ['Hacer tareas / repasar', 'Completa tus deberes escolares', '16:00', 3, '📚'],
    ['Cena saludable', 'Cena y descubre un tip', '19:00', 2, '🥗'],
    ['Actividad física', 'Muévete 15 minutos', '17:30', 2, '🏃'],
    ['Cuidar animales', 'Alimenta gallinas y periquitos', '08:00', 2, '🐔']
  ].map((x, i) => ({ id: i + 1, n: x[0], d: x[1], t: x[2], s: x[3], i: x[4], done: false })),
  history: [],
  petChat: []
};

function clone(x) { return JSON.parse(JSON.stringify(x)); }

function norm(d) {
  d = d || clone(initial);
  d.pin = /^\d{4}$/.test(d.pin || '') ? d.pin : '2580';
  d.kids = d.kids || clone(initial.kids);
  Object.keys(initial.kids).forEach(k => {
    d.kids[k] = Object.assign(clone(initial.kids[k]), d.kids[k] || {});
    d.kids[k].pet = Object.assign(clone(initial.kids[k].pet), d.kids[k].pet || {});
  });
  d.child = d.kids[d.child] ? d.child : 'violeta';
  d.lang = Object.assign(clone(initial.lang), d.lang || {});
  d.lang.weekly = Object.assign(clone(initial.lang.weekly), d.lang.weekly || {});
  d.missions = Array.isArray(d.missions) ? d.missions : clone(initial.missions);
  d.history = d.history || [];
  d.petChat = d.petChat || [];
  return d;
}

let D = norm(JSON.parse(localStorage.getItem(KEY) || 'null'));
save();

function save() {
  localStorage.setItem(KEY, JSON.stringify(D));
}

function C() {
  return D.kids[D.child];
}

function go(p) {
  document.querySelectorAll('.bottom button').forEach(b => b.classList.remove('active'));
  let n = document.getElementById('n-' + p);
  if (n) n.classList.add('active');
  if (p === 'home') home();
  if (p === 'learn') learn();
  if (p === 'prize') prize();
  if (p === 'pet') pet();
}

function childTabs() {
  return `<div class="tabs">${Object.entries(D.kids).map(([k, c]) => `
    <button class="tab ${D.child === k ? 'active' : ''}" onclick="D.child='${k}';save();home()">${c.name}<br><small>${c.age} años</small></button>
  `).join('')}</div>`;
}

function fmt(t) {
  let [h, m] = t.split(':').map(Number);
  return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h >= 12 ? 'PM' : 'AM');
}

function bar(n, v) {
  return `<div class="bar">
    <div class="barline"><span>${n}</span><span>${Math.round(v)}%</span></div>
    <div class="meter"><i style="width:${Math.max(0, Math.min(100, v))}%"></i></div>
  </div>`;
}

function state() {
  let h = new Date().getHours();
  return { sleep: h >= 20 || h < 7, school: h >= 7 && h < 14, play: h >= 15 && h < 19 };
}

function petMood(p) {
  let s = state();
  if (!p.healthy) return '🤒 No me siento bien. Necesito cuidados.';
  if (p.food < 30) return '🥺 Tengo hambre... ¿me das de comer?';
  if (p.clean < 30) return '🧼 Necesito limpieza.';
  if (s.sleep) return '😴 Estoy dormido/a... Zzz';
  if (s.school) return '🎒 ¡Hora de escuela!';
  if (s.play) return `🎾 ¡Hora de jugar con mi ${p.toy}!`;
  return '🥰 ¡Estoy feliz y bien cuidada!';
}

function missionStatus(m) {
  if (m.done) return 'Completada ✓';
  let [h, mi] = m.t.split(':').map(Number), d = new Date();
  d.setHours(h, mi, 0, 0);
  let x = d - new Date();
  if (x < 0) return '⚠️ Vencida';
  if (x < 3600000) return `⏰ Vence en ${Math.max(1, Math.round(x / 60000))} min`;
  return `⏰ ${fmt(m.t)}`;
}

function advice(m) {
  let n = m.n.toLowerCase();
  if (n.includes('limpiar')) return '🧹 Acuérdate: falta poco para tu tarea de limpieza.';
  if (n.includes('aliment')) return '🍎 ¡Hora de comer saludable!';
  if (n.includes('dorm')) return '🌙 Ya casi es hora de dormir.';
  if (n.includes('escuela')) return '🎒 ¡Prepara tu mochila!';
  if (n.includes('tarea')) return '📚 ¿Hacemos la tarea juntos?';
  return '🐾 Recuerda tu misión. ¡Tú puedes!';
}

function complete(id) {

  if (!m || m.done) return;
  m.done = true;
  C().stars += m.s;
  C().ach++;
  D.history.unshift({ kid: D.child, text: 'Completó ' + m.n, stars: m.s, date: new Date().toLocaleString() });
  save();
  home();
  if (D.missions.every(x => x.done)) showReward();
}

let Q = null;
function makeQ() {
  let pool = langs[D.lang.language][1].map(x => x.split('|'));
  let i = (D.lang.xp + D.lang.weekly.practices + new Date().getDate()) % pool.length;
  let a = pool[i], b = pool[(i + 3) % pool.length], c = pool[(i + 5) % pool.length];
  let opts = [a[1], b[1], c[1]].sort(() => Math.random() - .5);
  
  if (D.lang.level !== 'Básico' && (D.lang.weekly.practices + i) % 3 === 1) {
    opts = [a[0], b[0], c[0]].sort(() => Math.random() - .5);
    return { q: `Elige la palabra en ${D.lang.language} para “${a[1]}”.`, opts, ans: a[0], ex: `La respuesta correcta es ${a[0]}.` };
  }
  return { q: `¿Qué significa “${a[0]}”?`, opts, ans: a[1], ex: `“${a[0]}” significa “${a[1]}”.` };
}

function answer(btn, selectedOption) {
  let choices = document.querySelectorAll('.choice');
  choices.forEach(b => b.disabled = true);
  
  if (selectedOption === Q.ans) {
    btn.classList.add('correct');
    C().stars++;
    D.lang.xp += 10;
    D.lang.weekly.practices++;
    D.lang.weekly.words++;
    document.getElementById('fb').innerHTML = `
      <div class="feedback good">
        🎉 ¡Correcto! +10 XP y ⭐1.<br>${Q.ex}<br>
        <button class="btn green" onclick="learn()">Siguiente pregunta →</button>
      </div>`;
  } else {
    btn.classList.add('wrong');
    choices.forEach(b => {
      if (b.textContent === Q.ans) b.classList.add('correct');
    });
    C().stars = Math.max(0, C().stars - 1);
    D.lang.xp = Math.max(0, D.lang.xp - 5);
    document.getElementById('fb').innerHTML = `
      <div class="feedback bad">
        💡 Incorrecto: -1 ⭐ y -5 XP.<br><b>Respuesta correcta: ${Q.ans}</b><br>${Q.ex}<br>
        <button class="btn purple" onclick="learn()">Intentar otra →</button>
      </div>`;
  }
  save();
}

// NUEVO MOTOR DE CHAT CON LÓGICA Y RAZONAMIENTO
const chatBrain = {
  // Analiza el texto y devuelve una respuesta basada en contexto y lógica
  process: (text, p) => {
    const t = text.toLowerCase().trim();
    
    // 1. Lógica Matemática
    const mathMatch = t.match(/^(\d+)\s*([\+\-\*\/x])\s*(\d+)$/);
    if (mathMatch) {
      const num1 = parseInt(mathMatch[1]);
      const op = mathMatch[2].replace('x', '*'); // Normalizar 'x' a '*'
      const num2 = parseInt(mathMatch[3]);
      let result;
      try {
        result = eval(`${num1}${op}${num2}`); // Realizar cálculo
        if(isNaN(result) || !isFinite(result)) throw new Error();
        return `🧠 ¡Hice los cálculos! ${num1} ${mathMatch[2]} ${num2} es igual a **${result}**. ¡Pan comido! 🐾`;
      } catch(e) {
        return `😅 Uy, ese cálculo me marea un poco. ¿Intentamos con números más simples?`;
      }
    }

    // Prefijos de respuesta variados para naturalidad
    const prefixes = ['¡Guau!', 'Miau...', '¡Hola hola!', 'Paw-sitive...', 'Paw-creíble...', 'Interesante...', '🐾'];
    const pfx = prefixes[Math.floor(Math.random() * prefixes.length)];

    // 2. Lógica Educativa / Tareas
    if (/tarea|matem|español|ciencia|historia|cultura|idioma|geograf/.test(t)) {
      return `${pfx} 📚 ¡Me encanta aprender! Escribe la pregunta exacta de tu tarea o el tema de cultura general. ¡Te ayudaré a razonarlo juntos paso a paso! 🧠🐾`;
    }

    // 3. Lógica de Ayuda (Contextualizada al estado de la mascota)
    if (/ayuda|que hago|necesitas/.test(t)) {
      let suggestions = [];
      if(p.food < 40) suggestions.push('tengo algo de **hambre** 🍖');
      if(p.clean < 40) suggestions.push('necesito un buen **baño** 🧼');
      if(p.energy < 40) suggestions.push('estoy muy **cansada/o** 😴');
      if(p.happy < 40) suggestions.push('me siento un poco **sola/o**... ¿jugamos? 🎾');

      if(suggestions.length > 0) {
        return `${pfx} ¡Gracias por preguntar! Justo ahora ${suggestions.join(' y ')}. ¿Me ayudas con eso? 🐾😊`;
      } else {
        return `${pfx} 💖 ¡Estoy genial! Todo mi cuidado está al día gracias a ti. ¡Eres el/la mejor cuidador/a! 🌟🐾`;
      }
    }

    // 4. Lógica de Diversión
    if (/divert|jugar|chiste|cuento/.test(t)) {
      const funPrefixes = ['¡Sí! 🎾', 'Miau... ¡Vamos! 🧶', '¡A correr! 🐇'];
      const fPfx = funPrefixes[Math.floor(Math.random() * funPrefixes.length)];
      return `${fPfx} ¡Me encanta divertirme! ¿Jugamos a algo o me cuentas un chiste Paw-creíble? 😜🐾`;
    }

    // 5. Saludos y otros
    if (/hola|hey|saludos/.test(t)) {
      return `¡Hola, ${C().name}! 👋 🐾 ¿Cómo estás hoy? ¿Listos para misiones o para aprender algo Paw-creíble juntos? 😊`;
    }

    if (/gracias/.test(t)) {
      return `¡De nada! 🥰 🐾 Siempre aquí para apoyarte. ¡Eres súper!`;
    }

    // Respuesta por defecto con prefijo natural
    return `${pfx} Entiendo. 🐾 Cuéntame un poquito más sobre eso o hazme una Paw-pregunta para que lo pensemos juntos. 🧠 😊`;
  },

  // Genera opciones rápidas basadas en contexto para evitar redundancia
  getQuickOptions: (p) => {
    let opts = [];
    
    // Opciones basadas en cuidado si están bajas
    if(p.food < 40) opts.push('¿Tienes hambre?');
    if(p.clean < 40) opts.push('¿Necesitas baño?');
    if(p.happy < 40) opts.push('¿Jugamos?');
    
    // Opciones educativas fijas pero con texto dinámico
    const eduTopics = ['Mates', 'Idioma', 'Historia'];
    opts.push(`Ayuda Tarea ${eduTopics[new Date().getSeconds() % eduTopics.length]}`);
    
    // Opciones de interacción
    opts.push('Cuéntame algo Paw-creíble');
    
    // Opciones matemáticas de ejemplo
    opts.push('¿Cuánto es 2x2?', '¿Cuánto es 10+5?');
    
    // Mezclar y limitar a 4 opciones
    return opts.sort(() => Math.random() - 0.5).slice(0, 4);
  }
};

function quick(t) {
  document.getElementById('msg').value = t;
  send();
}

function send() {
  let input = document.getElementById('msg');
  let text = input.value.trim();
  if (!text) return;
  input.value = ''; // Limpiar input inmediatamente

  let p = C().pet;
  
  // Usar el motor chatBrain para razonar la respuesta contextual Paw-lógica
  const r = chatBrain.process(text, p);
  
  // Guardar interacción
  if(!D.petChat) D.petChat = [];
  D.petChat.push(
    { kid: D.child, pet: p.name, me: true, text: text },
    { kid: D.child, pet: p.name, me: false, text: r }
  );
  save();
  petChat(); // Recargar chat para mostrar mensajes y Paw-menú dinámico
}

function openMom() {
  document.getElementById('modal').classList.add('show');
  pinIn = '';
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <h2>🔐 Panel de Control de Padres</h2>
    <p>Ingresa el PIN de 4 dígitos:</p>
    <div class="dots" id="dots">○ ○ ○ ○</div>
    <div class="pin">
      ${[1,2,3,4,5,6,7,8,9,'×',0,'⌫'].map(x => `<button onclick="pressPin('${x}')">${x}</button>`).join('')}
    </div>
  `;
}

let pinIn = '';
function pressPin(x) {
  if (x === '×') { openMom(); return; }
  if (x === '⌫') pinIn = pinIn.slice(0, -1);
  else if (pinIn.length < 4) pinIn += x;
  
  document.getElementById('dots').textContent = '• '.repeat(pinIn.length) + '○ '.repeat(4 - pinIn.length);
  
  if (pinIn.length === 4) {
    if (pinIn === D.pin) dashboard();
    else {
      bubble('🔐 PIN incorrecto');
      setTimeout(openMom, 800);
    }
  }
}

function dashboard() {
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <h2>💗 Panel de Administración</h2>
    <div class="grid">
      <button class="tile" onclick="extra()">⭐<strong>Dar estrellas</strong></button>
      <button class="tile" onclick="manage()">📅<strong>Misiones</strong></button>
      <button class="tile" onclick="progress()">📊<strong>Progreso</strong></button>
      <button class="tile" onclick="hist()">🕘<strong>Historial</strong></button>
    </div>
    
    <section class="card" style="margin-top:15px">
      <h3>🔑 Cambiar PIN de acceso</h3>
      <input id="np" maxlength="4" inputmode="numeric" value="${D.pin}">
      <button class="btn purple" onclick="changePin()">Guardar PIN</button>
    </section>
    
    <section class="card">
      <h3>🐾 Estado de Salud de las Mascotas</h3>
      ${Object.values(D.kids).map(c => `
        <p><b>${c.name}:</b> ${c.pet.emoji} ${c.pet.name} (${c.pet.healthy ? '😊 Saludable' : '🤒 Necesita atención'}) · Comida: ${Math.round(c.pet.food)}% · Felicidad: ${Math.round(c.pet.happy)}%</p>
      `).join('')}
    </section>
  `;
}

function changePin() {
  let p = document.getElementById('np').value;
  if (/^\d{4}$/.test(p)) {
    D.pin = p;
    save();
    dashboard();
  } else {
    bubble('El PIN debe contener exactamente 4 dígitos.');
  }
}

function extra() {
  let k = prompt('Escribe el usuario (violeta, eliseo o misael):', 'violeta');
  let n = Number(prompt('Cantidad de estrellas a otorgar (1, 2, 3 o 5):', '3'));
  if (D.kids[k] && [1, 2, 3, 5].includes(n)) {
    D.kids[k].stars += n;
    D.history.unshift({ kid: k, text: 'Estrellas otorgadas por los padres', stars: n, date: new Date().toLocaleString() });
    save();
    dashboard();
  }
}

function manage() {
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="dashboard()">←</button>
    <h2>📅 Misiones y Horarios</h2>
    ${D.missions.map(m => `
      <div class="mission">
        <div class="mi">${m.i}</div>
        <div>
          <h3>${m.n}</h3>
          <p>${m.d}</p>
          <div class="meta">${fmt(m.t)} · ⭐${m.s}</div>
        </div>
        <button class="${m.done ? 'check' : 'plus'}" onclick="mDone(${m.id})">${m.done ? '✓' : '+'}</button>
      </div>
    `).join('')}
    
    <section class="card" style="margin-top:15px">
      <h3>➕ Agregar nueva misión</h3>
      <input id="mn" placeholder="Ej: Leer 20 minutos">
      <input id="mt" type="time" value="17:00">
      <button class="btn" onclick="addM()">Agregar Misión</button>
    </section>
  `;
}

function mDone(id) {
  let m = D.missions.find(x => x.id === id);
  if (m) m.done = !m.done;
  save();
  manage();
}

function addM() {
  let n = document.getElementById('mn').value.trim();
  if (!n) return;
  D.missions.push({ id: Date.now(), n: n, d: 'Misión personalizada', t: document.getElementById('mt').value, s: 2, i: '✨', done: false });
  save();
  manage();
}

function progress() {
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="dashboard()">←</button>
    <h2>📊 Progreso General</h2>
    ${Object.values(D.kids).map(c => `
      <section class="card">
        <b>${c.avatar} ${c.name}</b>
        <p>⭐ ${c.stars} Estrellas · 🔥 ${c.streak} Días de Racha · Nivel ${c.level}</p>
        ${bar('Progreso de Nivel', c.stars % 100)}
      </section>
    `).join('')}
  `;
}

function hist() {
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="dashboard()">←</button>
    <h2>🕘 Historial de Actividad</h2>
    ${(D.history || []).slice(0, 20).map(h => `
      <p style="border-bottom: 1px solid #eee; padding-bottom: 5px;">
        ⭐${h.stars} · <b>${D.kids[h.kid] ? D.kids[h.kid].name : h.kid}</b><br>
        <small>${h.text} · ${h.date}</small>
      </p>
    `).join('') || '<p>No hay registros guardados.</p>'}
  `;
}

function prize() {
  document.getElementById('screen').innerHTML = `
    <section class="card">
      <h2>🏆 Premios y Logros</h2>
      <div class="grid">
        <div class="tile">🔥<strong>Rachas</strong><small>Constancia diaria</small></div>
        <div class="tile">🌍<strong>Idiomas</strong><small>Nivel de XP</small></div>
        <div class="tile">🐾<strong>Cuidador</strong><small>Salud de la mascota</small></div>
        <div class="tile">🎁<strong>Premios</strong><small>Metas alcanzadas</small></div>
      </div>
    </section>
    <section class="card">
      <button class="btn yellow" onclick="showReward()">Ver Recompensa Activa ⭐</button>
    </section>
  `;
}

function showReward() {
  document.getElementById('rewardText').textContent = D.reward;
  document.getElementById('reward').classList.add('show');
}

function closeReward() {
  document.getElementById('reward').classList.remove('show');
}

function bubble(t) {
  document.getElementById('modal').classList.add('show');
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="closeModal()">×</button>
    <div style="font-size:55px;text-align:center;margin-top:10px">${C().pet.emoji}</div>
    <h2 style="text-align:center">${C().pet.name}</h2>
    <div class="card" style="font-size:16px;text-align:center;line-height:1.4">${t}</div>
    <button class="btn purple" onclick="closeModal()">Entendido 💜</button>
  `;
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function notify() {
  let p = C().pet;
  if (p.food < 35) bubble('🍖 Tengo algo de hambre... ¡Recuerda alimentar a tu mascota con Paw-lógica!');
  else if (p.clean < 35) bubble('🧼 ¡Hora de un buen baño Paw-limpio!');
  else {
    let pending = D.missions.find(m => !m.done);
    if (pending) bubble(advice(pending));
    else bubble('🥰 ¡Estás al día con tus misiones Paw-bien hecho! ¡Excelente trabajo!');
  }
}

// FUNCIÓN DE ANIMACIÓN VECTORIAL SEGÚN ESPECIE Paw-realista
function spawn() {
  if (!state().play) return;
  
  let petEmoji = C().pet.emoji;
  let animData = PET_ANIMATIONS[petEmoji] || PET_ANIMATIONS['🐶'];
  
  let container = document.createElement('div');
  container.className = `runner-animated ${animData.type}`;
  
  let img = document.createElement('img');
  img.src = animData.url;
  img.alt = C().pet.name;
  
  container.appendChild(img);
  
  container.onclick = () => {
    container.remove();
    bubble(`¡Atrapaste a ${C().pet.name}! 🎾 ¡Es Paw-súper veloz y se divirtió muchísimo Paw-contigo!`);
  };
  
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 10000); // 10s de Paw-duración
}

function decay() {
  Object.values(D.kids).forEach(c => {
    let p = c.pet;
    p.food = Math.max(0, p.food - 0.5);
    p.clean = Math.max(0, p.clean - 0.2);
    if (p.food < 25 || p.clean < 25) p.healthy = false;
  });
  save();
}

// Iniciar Paw-home y bucles de Paw-evento
home();
setInterval(spawn, 18000); // Intento de spawn cada 18s
setInterval(decay, 60000); // Desgaste cada minuto
</script>
</body>
</html>
