<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191a20">
<title>Mis Pequeñas Misiones 5.0</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
 --pink:#ec5b89;--pink2:#f6a4bc;--purple:#7953bd;--yellow:#ffd83d;
 --green:#21a789;--ink:#403647;--muted:#7c747d;--bg:#fbf7fb;--line:#e9dfe8;
 --card:#fff;--soft:#fff2f7;--blue:#edfaff;--shadow:0 5px 20px rgba(50,30,60,.08)
}
*{box-sizing:border-box}
html,body{margin:0;background:#191a20;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:720px;min-height:100vh;margin:auto;background:linear-gradient(#fffafd,#faf7fb);padding-bottom:92px}
.topbar{height:58px;background:#191a20;color:white;display:flex;align-items:center;padding:0 18px;font-weight:800;font-size:18px}
.header{background:#fffafd;border-bottom:1px solid var(--line);padding:20px 24px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:13px}.brand .star{font-size:54px;line-height:1}.brand h1{font-size:28px;margin:0 0 2px;letter-spacing:-.6px}.brand p{margin:0;color:#817985;font-size:16px}
.iconbtn{border:0;background:white;border-radius:22px;width:58px;height:58px;box-shadow:var(--shadow);font-size:29px}
main{padding:16px 18px}
.child-tabs{display:flex;gap:8px;overflow:auto;margin:0 0 14px}.child-tab{border:1px solid var(--line);background:#fff;border-radius:18px;padding:10px 15px;min-width:108px;font-weight:800;color:var(--muted)}.child-tab.active{background:#fff0f6;border:2px solid var(--pink);color:var(--pink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);padding:17px;margin:12px 0}
.profile{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#fff,#fff1f7);padding:19px}
.avatar{width:94px;height:94px;border-radius:28px;background:#eee4ff;display:grid;place-items:center;font-size:59px;flex:none}
.profile h2{margin:0;font-size:28px}.profile .age{color:var(--muted);font-size:17px;margin:2px 0 10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 11px;font-weight:800;font-size:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.section-head h2{margin:0;font-size:23px}.outline{border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px 16px;font-weight:800}
.mission{display:grid;grid-template-columns:52px 1fr 44px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.mission:last-child{border-bottom:0}.mi{width:52px;height:52px;border-radius:18px;background:#fff4bd;display:grid;place-items:center;font-size:29px}.mission h3{margin:0;font-size:17px}.mission p{margin:2px 0 0;color:var(--muted);font-size:14px}.meta{color:var(--green);font-weight:800;font-size:13px;margin-top:5px}.plus,.check{width:43px;height:43px;border:0;border-radius:50%;font-weight:900;font-size:25px}.plus{background:#eaf8f4;color:var(--green)}.check{background:#dff6ed;color:var(--green)}
.banner{background:linear-gradient(135deg,#ffe889,#fff3c5);border:1px solid #efd66a;border-radius:21px;padding:14px;text-align:center;font-weight:900;font-size:16px}.banner span{font-size:29px;margin-left:10px}
.learn-card{background:linear-gradient(135deg,#f5edff,#fff)}.pill{display:inline-block;background:#eee5fb;color:#6b46a7;border-radius:16px;padding:6px 10px;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;text-align:left}.tile .ico{font-size:28px}.tile strong{display:block;margin-top:5px}.tile small{color:var(--muted)}
.pet{background:linear-gradient(135deg,#ecfaff,#fff)}.petface{text-align:center;font-size:90px}.pet h2{text-align:center;margin:0}.petname{text-align:center;font-size:19px;font-weight:900}.bar{margin:8px 0}.barline{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.meter{height:10px;border-radius:20px;background:#eee;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow))}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:82px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.bottom button{border:0;background:white;color:#746d75;font-size:12px;padding:6px}.bottom b{display:block;font-size:25px;margin-bottom:2px}.bottom .active{color:var(--pink);font-weight:900}
.hidden{display:none!important}
.btn{border:0;border-radius:15px;padding:12px 15px;background:var(--pink);color:white;font-weight:900}.btn.purple{background:var(--purple)}.btn.yellow{background:var(--yellow);color:#654d00}.btn.green{background:var(--green)}
.modal{position:fixed;inset:0;background:rgba(25,20,30,.6);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:22px}.close{float:right;border:0;background:#f5edf6;border-radius:50%;width:40px;height:40px;font-size:23px}.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.pin button{padding:16px;border:1px solid #efb3c7;background:#fff;border-radius:22px;color:#d94e7d;font-weight:900;font-size:19px}.dots{text-align:center;color:var(--pink);font-size:24px;letter-spacing:6px}
.choice{width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:14px;text-align:left;margin:5px 0}.story{background:#fff3c9;border-radius:18px;padding:15px;line-height:1.55}
.reward{position:fixed;inset:0;background:rgba(30,20,35,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}.reward.show{display:flex}.rewardbox{background:#fff;border-radius:32px;text-align:center;padding:26px;width:min(500px,100%);box-shadow:0 20px 60px #0005;animation:pop .4s}.bigstar{font-size:140px;line-height:1;animation:star 1s infinite alternate}.rewardbox h2{color:var(--pink);margin:8px}.rewardbox p{font-size:20px;font-weight:800}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes star{to{transform:scale(1.08) rotate(4deg)}}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;margin:5px 0 10px;background:#fff;color:var(--ink)}
label{font-size:12px;font-weight:900}
@media(max-width:520px){.brand h1{font-size:25px}.brand .star{font-size:48px}.profile h2{font-size:25px}.avatar{width:86px;height:86px;font-size:53px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">‹ &nbsp; Mis Pequeñas Misiones 5.0</div>
  <header class="header">
    <div class="brand"><div class="star">⭐</div><div><h1>Mis Pequeñas Misiones</h1><p>Pequeñas acciones, grandes hábitos</p></div></div>
    <button class="iconbtn" onclick="notify()">🔔</button>
  </header>
  <main id="screen"></main>
  <nav class="bottom">
    <button id="nav-home" onclick="go('home')"><b>🏠</b>Inicio</button>
    <button id="nav-learn" onclick="go('learn')"><b>🎯</b>Aprender</button>
    <button id="nav-prize" onclick="go('prize')"><b>🏆</b>Premios</button>
    <button id="nav-pet" onclick="go('pet')"><b>🐾</b>Mascota</button>
    <button id="nav-mom" onclick="openMom()"><b>🔐</b>Mamá</button>
  </nav>
</div>

<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<div id="reward" class="reward"><div class="rewardbox"><div class="bigstar">⭐</div><h2>¡REGALO DESBLOQUEADO!</h2><p id="rewardText"></p><button class="btn" onclick="closeReward()">¡Genial! 🎉</button></div></div>

<script>
const KEY='MPM5_FINAL_DATA';
const initial={
 pin:'2580',
 reward:'¡Ganaste un helado! 🍦',
 child:'violeta',
 lang:{language:'Inglés',level:'Básico',words:5,xp:120,streak:3},
 kids:{
  violeta:{name:'Violeta',age:13,level:7,stars:48,streak:6,ach:4,avatar:'👧',pet:{emoji:'🐶',name:'Luna',happy:80,food:78,energy:88,clean:92,accessory:'🕶️'}},
  eliseo:{name:'Eliseo',age:9,level:5,stars:42,streak:8,ach:3,avatar:'👦',pet:{emoji:'🐱',name:'Milo',happy:91,food:85,energy:90,clean:88,accessory:'🧢'}},
  misael:{name:'Misael',age:7,level:3,stars:38,streak:4,ach:2,avatar:'👦',pet:{emoji:'🐰',name:'Nube',happy:86,food:80,energy:92,clean:93,accessory:'🎩'}}
 },
 missions:[
  {id:1,n:'Alimentación saludable',d:'Come frutas y toma agua',t:'13:00',s:2,i:'🍎',done:false},
  {id:2,n:'Dientes y baño',d:'Cepíllate los dientes y báñate',t:'18:00',s:2,i:'🪥',done:false},
  {id:3,n:'Apagar luces y TV',d:'Apaga lo que no se usa',t:'19:30',s:2,i:'💡',done:false},
  {id:4,n:'Prepararse para dormir',d:'Pijama, dientes y a la cama',t:'20:30',s:3,i:'🌙',done:false},
  {id:5,n:'Ve a la escuela',d:'Mochila lista y llegar a tiempo',t:'07:15',s:2,i:'🎒',done:false},
  {id:6,n:'Hora de limpiar',d:'Ordena tus cosas y colabora en casa',t:'17:00',s:2,i:'🧹',done:false},
  {id:7,n:'Hacer tareas / repasar',d:'Completa tus deberes escolares',t:'16:00',s:3,i:'📚',done:false},
  {id:8,n:'Cena saludable',d:'Cena y descubre un tip',t:'19:00',s:2,i:'🥗',done:false},
  {id:9,n:'Actividad física',d:'Muévete 15 minutos',t:'17:30',s:2,i:'🏃',done:false},
  {id:10,n:'Cuidar animales',d:'Alimenta gallinas y periquitos',t:'08:00',s:2,i:'🐔',done:false}
 ],
 history:[]
};
let D=JSON.parse(localStorage.getItem(KEY)||'null')||initial;
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function C(){return D.kids[D.child]}
function go(page){
 document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));
 const n=document.getElementById('nav-'+(page==='home'?'home':page));
 if(n)n.classList.add('active');
 if(page==='home')home(); if(page==='learn')learn(); if(page==='prize')prize(); if(page==='pet')pet();
}
function childTabs(){
 return `<div class="child-tabs">${Object.entries(D.kids).map(([k,c])=>`<button class="child-tab ${D.child===k?'active':''}" onclick="setChild('${k}')">${c.name}<br><small>${c.age} años</small></button>`).join('')}</div>`;
}
function setChild(k){D.child=k;save();go('home')}
function profile(){
 const c=C();
 return `<section class="card profile"><div class="avatar">${c.avatar}</div><div><h2>¡Hola, ${c.name}! 🌟</h2><div class="age">${c.age} años · Nivel ${c.level}</div><div class="chips"><span class="chip">⭐ ${c.stars} estrellas</span><span class="chip">🔥 ${c.streak} días</span><span class="chip">🏆 ${c.ach} logros</span></div></div></section>`;
}
function missionList(){
 return `<section class="card"><div class="section-head"><h2>📋 Misiones del día</h2><button class="outline" onclick="showAll()">Ver todas</button></div>
 ${D.missions.slice(0,6).map(m=>`<div class="mission"><div class="mi">${m.i}</div><div><h3>${m.n}</h3><p>${m.d}</p><div class="meta">⏰ ${fmt(m.t)} · ⭐ ${m.s}</div></div><button class="${m.done?'check':'plus'}" onclick="complete(${m.id})">${m.done?'✓':'+'}</button></div>`).join('')}</section>`;
}
function home(){
 const c=C(),p=c.pet;
 document.getElementById('screen').innerHTML=childTabs()+profile()+missionList()+
 `<div class="banner">¡Completa todas tus misiones y gana estrellas extra! <span>🎁</span></div>
 <section class="card learn-card"><div class="section-head"><h2>📚 Aprende hoy</h2><span class="pill">Adaptado a tu edad</span></div><p>Tu Academia de Idiomas tiene una práctica preparada para ti.</p><button class="btn purple" onclick="go('learn')">Continuar aprendizaje →</button></section>
 <section class="card"><div class="section-head"><h2>💡 Consejo de hoy</h2><button class="outline" onclick="tip()">Otro consejo ✨</button></div><p id="tipText">${dailyTip(c.age)}</p></section>
 <section class="card pet"><h2>🐾 Mi mascota</h2><div class="petface">${p.emoji}${p.accessory}</div><div class="petname">${p.name}</div><p>❤️ ${p.happy}% felicidad · 🍖 ${p.food}% alimentación</p><button class="btn green" onclick="go('pet')">Cuidarla →</button></section>`;
}
function dailyTip(age){
 const a=age<10?['Ordena tus cosas después de jugar. 🧸','Toma agua durante el día. 💧','Cepíllate los dientes con calma. 🪥','Aprende una palabra nueva hoy. 📚']:['Organiza tu tiempo antes de empezar tus tareas. ⏱️','Ayudar en casa también es una forma de responsabilidad. 🏠','Practica un idioma 10 minutos hoy. 🌍','Antes de dormir, prepara lo que necesitarás mañana. 🎒'];
 return a[new Date().getDate()%a.length];
}
function tip(){document.getElementById('tipText').textContent='✨ '+dailyTip(C().age)+' ¡Tú puedes!'}
function fmt(t){let [h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}
function complete(id){
 const m=D.missions.find(x=>x.id===id),c=C(); if(!m||m.done)return;
 m.done=true;c.stars+=m.s;c.streak=Math.max(c.streak,1);c.ach++;
 D.history.unshift({kid:D.child,text:'Completó '+m.n,stars:m.s,date:new Date().toLocaleString()});save();home();
 if(D.missions.filter(x=>!x.done).length===0)showReward();
}
function showAll(){
 document.getElementById('screen').innerHTML=childTabs()+`<section class="card"><div class="section-head"><h2>📋 Todas las misiones</h2><button class="outline" onclick="go('home')">← Inicio</button></div>${D.missions.map(m=>`<div class="mission"><div class="mi">${m.i}</div><div><h3>${m.n}</h3><p>${m.d}</p><div class="meta">⏰ ${fmt(m.t)} · ⭐ ${m.s}</div></div><button class="${m.done?'check':'plus'}" onclick="complete(${m.id})">${m.done?'✓':'+'}</button></div>`).join('')}</section>`;
}
const langs=['Inglés','Francés','Portugués','Italiano','Alemán','Japonés'];
const vocab={Inglés:['apple|manzana','school|escuela','friend|amigo'],Francés:['bonjour|hola','école|escuela','ami|amigo'],Portugués:['casa|casa','amigo|amigo','água|agua'],Italiano:['ciao|hola','scuola|escuela','amico|amigo'],Alemán:['haus|casa','freund|amigo','schule|escuela'],Japonés:['neko|gato','mizu|agua','tomodachi|amigo']};
function learn(){
 const c=C(),L=D.lang,w=vocab[L.language][0].split('|');
 document.getElementById('screen').innerHTML=`<section class="card"><div class="section-head"><h2>🌍 Academia de Idiomas</h2><span class="pill">Nivel ${L.level}</span></div>
 <div class="tabs">${langs.map(x=>`<button class="outline" onclick="setLang('${x}')">${x}</button>`).join('')}</div>
 <div class="card learn-card"><h3>🗺️ Ruta de aprendizaje</h3><p>Lecciones adaptadas automáticamente para ${c.name}, ${c.age} años.</p><div class="grid"><button class="tile" onclick="lesson()"><span class="ico">📘</span><strong>Lección del día</strong><small>+10 XP</small></button><button class="tile" onclick="conversation()"><span class="ico">💬</span><strong>Conversación</strong><small>Habla y responde</small></button><button class="tile" onclick="listen()"><span class="ico">🎧</span><strong>Escucha</strong><small>Comprensión auditiva</small></button><button class="tile" onclick="pronounce('${w[0]}')"><span class="ico">🎤</span><strong>Pronunciación</strong><small>Puntuación 0–100</small></button></div></div>
 <section class="card"><h3>🧠 Palabra de hoy</h3><h2>${w[0]}</h2><p>${w[1]}</p><button class="btn" onclick="speak('${w[0]}')">🔊 Escuchar</button> <button class="btn purple" onclick="pronounce('${w[0]}')">🎤 Practicar</button></section>
 <section class="card"><h3>📖 Historia</h3><div class="story"><b>${c.name} y su aventura</b><p>Today ${c.name} goes to school, helps at home and remembers to care for a pet.</p><button class="btn yellow" onclick="story()">Responder</button></div></section>
 <section class="card"><h3>🔥 Desafío semanal</h3><p>5 prácticas · 10 palabras · 1 conversación</p><div class="meter"><i style="width:${Math.min(100,L.xp%100)}%"></i></div><p><b>${L.xp} XP</b> · Racha ${L.streak} días</p></section></section>`;
}
function setLang(x){D.lang.language=x;save();learn()}
function lesson(){D.lang.xp+=10;C().stars+=1;save();alert('¡Lección completada! +10 XP y ⭐1');learn()}
function conversation(){D.lang.xp+=5;save();alert('💬 Di en voz alta: “Hello, my name is '+C().name+'.”');learn()}
function listen(){D.lang.xp+=5;save();alert('🎧 Escucha la palabra y selecciona su significado en el siguiente ejercicio.');learn()}
function story(){D.lang.xp+=5;save();alert('¡Muy bien! +5 XP 📖');learn()}
function speak(t){if(!('speechSynthesis'in window))return alert('Tu navegador no admite audio.');let map={Inglés:'en-US',Francés:'fr-FR',Portugués:'pt-BR',Italiano:'it-IT',Alemán:'de-DE',Japonés:'ja-JP'};let u=new SpeechSynthesisUtterance(t);u.lang=map[D.lang.language];speechSynthesis.speak(u)}
function pronounce(target){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R)return alert('El reconocimiento de voz no está disponible en este navegador. Puedes usar 🔊 Escuchar para practicar.');
 const r=new R();r.lang={Inglés:'en-US',Francés:'fr-FR',Portugués:'pt-BR',Italiano:'it-IT',Alemán:'de-DE',Japonés:'ja-JP'}[D.lang.language];r.onresult=e=>{let said=e.results[0][0].transcript.toLowerCase(),t=target.toLowerCase();let score=said===t?100:Math.max(0,Math.round(100*(1-Math.abs(said.length-t.length)/Math.max(said.length,t.length))));D.lang.xp+=Math.round(score/10);save();alert('🎤 '+said+'\\nPuntuación: '+score+'/100');learn()};r.start()
}
function pet(){
 const c=C(),p=c.pet;
 document.getElementById('screen').innerHTML=childTabs()+`<section class="card pet"><h2>🐾 Mascota de ${c.name}</h2><div class="petface">${p.emoji}${p.accessory}</div><div class="petname">${p.name}</div><p>${petMood(p)}</p>${bar('❤️ Felicidad',p.happy)}${bar('🍖 Alimentación',p.food)}${bar('⚡ Energía',p.energy)}${bar('🧼 Higiene',p.clean)}
 <div class="grid"><button class="btn green" onclick="care('food')">🍖 Alimentar</button><button class="btn purple" onclick="care('clean')">🧼 Bañar</button><button class="btn yellow" onclick="care('play')">🎾 Jugar</button><button class="btn" onclick="care('walk')">🦮 Pasear</button></div></section>
 <section class="card"><h3>🎀 Personalizar mascota</h3><div class="grid">${['🎀','🕶️','🧢','🎩','👓','🧣','🦋','✨'].map(a=>`<button class="tile" onclick="C().pet.accessory='${a}';save();pet()"><span class="ico">${a}</span><strong>Usar</strong></button>`).join('')}</div>
 <label>Nombre</label><input id="petname" value="${p.name}"><button class="btn" onclick="C().pet.name=document.getElementById('petname').value||'Luna';save();pet()">Guardar nombre</button></section>
 <section class="card"><h3>🐶🐱🐰🦊🐼 Elegir mascota</h3><div class="grid">${[['🐶','Perrito'],['🐱','Gatito'],['🐰','Conejito'],['🦊','Zorrito'],['🐼','Panda']].map(a=>`<button class="tile" onclick="C().pet.emoji='${a[0]}';save();pet()"><span class="ico">${a[0]}</span><strong>${a[1]}</strong></button>`).join('')}</div></section>
 <section class="card"><h3>🔔 Alerta de mascota</h3><p>“${alertText()}”</p><button class="btn purple" onclick="petSpeak()">🔊 Escuchar</button></section>`;
}
function bar(name,v){return `<div class="bar"><div class="barline"><span>${name}</span><span>${v}%</span></div><div class="meter"><i style="width:${v}%"></i></div></div>`}
function petMood(p){let avg=(p.happy+p.food+p.energy+p.clean)/4;return avg>80?'🥰 ¡Estoy feliz y bien cuidada!':avg>55?'🙂 Necesito un poquito de atención.':'😟 ¡No me olvides! Necesito cuidados.'}
function care(type){let p=C().pet;if(type==='food')p.food=Math.min(100,p.food+16);if(type==='clean')p.clean=Math.min(100,p.clean+16);if(type==='play'){p.happy=Math.min(100,p.happy+12);p.energy=Math.max(0,p.energy-5)}if(type==='walk'){p.happy=Math.min(100,p.happy+10);p.energy=Math.max(0,p.energy-8)}p.happy=Math.min(100,p.happy+3);save();pet()}
function alertText(){return D.missions.some(m=>!m.done)?'Ve a revisar tu panel de actividades. Tienes tareas pendientes.':'¡Todo al día! ¿Jugamos juntos?'}
function petSpeak(){let u=new SpeechSynthesisUtterance(alertText());u.lang='es-DO';speechSynthesis.speak(u)}
function prize(){
 document.getElementById('screen').innerHTML=`<section class="card"><h2>🏆 Premios y logros</h2><div class="grid"><div class="tile">🔥<strong>Rachas</strong><small>Premios por constancia</small></div><div class="tile">🌍<strong>Idiomas</strong><small>XP y desafíos</small></div><div class="tile">🏠<strong>Ayudante</strong><small>Misiones de casa</small></div><div class="tile">🐾<strong>Cuidador</strong><small>Mascota saludable</small></div></div></section>
 <section class="card"><h3>🎁 Regalo final</h3><p>Al completar todas las misiones se abre una estrella gigante con el mensaje elegido por mamá.</p><button class="btn yellow" onclick="showReward()">Ver demostración ⭐</button></section>
 <section class="card"><h3>📜 Historial de estrellas</h3>${D.history.slice(0,12).map(h=>`<p>⭐${h.stars} · ${D.kids[h.kid].name}<br><small>${h.text} · ${h.date}</small></p>`).join('')||'<p class="muted">Todavía no hay movimientos.</p>'}</section>`;
}
function openMom(){document.getElementById('modal').classList.add('show');pinUI()}
let pinIn='';
function pinUI(){pinIn='';document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>🔐 Panel de Mamá</h2><p>Ingresa tu clave de 4 dígitos para continuar.</p><div class="dots" id="dots">○ ○ ○ ○</div><div class="pin">${[1,2,3,4,5,6,7,8,9,'×',0,'⌫'].map(x=>`<button onclick="pin('${x}')">${x}</button>`).join('')}</div>`}
function pin(x){if(x==='×'){pinUI();return}if(x==='⌫'){pinIn=pinIn.slice(0,-1)}else if(pinIn.length<4){pinIn+=x}document.getElementById('dots').textContent='• '.repeat(pinIn.length)+'○ '.repeat(4-pinIn.length);if(pinIn.length===4){if(pinIn===D.pin)dashboard();else{alert('Clave incorrecta');pinUI()}}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function dashboard(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>💗 Panel de Mamá</h2><p>Administra misiones, horarios, estrellas, progreso y premios.</p>
<div class="grid"><button class="tile" onclick="extraStars()">⭐<strong>Otorgar estrellas</strong><small>Acciones especiales</small></button><button class="tile" onclick="manage()">📅<strong>Misiones y horarios</strong><small>Crear y editar</small></button><button class="tile" onclick="progress()">📊<strong>Progreso</strong><small>Por niño</small></button><button class="tile" onclick="history()">🕘<strong>Historial</strong><small>Movimientos</small></button></div>
<section class="card"><h3>🎁 Premio personalizable</h3><label>Mensaje de la estrella gigante</label><input id="rewardInput" value="${D.reward}"><button class="btn" onclick="D.reward=document.getElementById('rewardInput').value||'¡Premio!';save();dashboard()">Guardar premio</button></section>
<section class="card"><h3>🔑 Cambiar clave</h3><input id="newpin" maxlength="4" inputmode="numeric" value="${D.pin}"><button class="btn purple" onclick="changePin()">Cambiar clave</button></section>`}
function extraStars(){let k=prompt('Escribe: violeta, eliseo o misael','violeta');if(!D.kids[k])return alert('No encontrado');let n=Number(prompt('¿Cuántas estrellas? 1, 2, 3 o 5','3'));if(![1,2,3,5].includes(n))return;let reason=prompt('Motivo','Ayudó sin que se lo pidieran')||'Acción extra';D.kids[k].stars+=n;D.history.unshift({kid:k,text:reason,stars:n,date:new Date().toLocaleString()});save();dashboard()}
function changePin(){let p=document.getElementById('newpin').value;if(!/^\d{4}$/.test(p))return alert('Usa exactamente 4 dígitos.');D.pin=p;save();dashboard()}
function manage(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="dashboard()">←</button><h2>📅 Misiones y horarios</h2>${D.missions.map(m=>`<div class="mission"><div class="mi">${m.i}</div><div><h3>${m.n}</h3><p>${m.d}</p><div class="meta">${fmt(m.t)} · ⭐${m.s}</div></div><button class="${m.done?'check':'plus'}" onclick="toggleMission(${m.id})">${m.done?'✓':'+'}</button></div>`).join('')}<section class="card"><h3>➕ Agregar nueva misión</h3><label>Nombre</label><input id="mn" placeholder="Ej. Leer 20 minutos"><label>Hora</label><input id="mt" type="time" value="17:00"><label>Estrellas</label><select id="ms"><option>1</option><option>2</option><option>3</option><option>5</option></select><button class="btn" onclick="addMission()">Agregar</button></section>`}
function toggleMission(id){let m=D.missions.find(x=>x.id===id);if(m){m.done=!m.done;save();manage()}}
function addMission(){let n=document.getElementById('mn').value.trim();if(!n)return;D.missions.push({id:Date.now(),n,d:'Misión personalizada',t:document.getElementById('mt').value,s:+document.getElementById('ms').value,i:'✨',done:false});save();manage()}
function progress(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="dashboard()">←</button><h2>📊 Progreso de los niños</h2>${Object.values(D.kids).map(c=>`<section class="card"><h3>${c.avatar} ${c.name}</h3><p>⭐ ${c.stars} · 🔥 ${c.streak} días · Nivel ${c.level}</p><label>Progreso de nivel</label><div class="meter"><i style="width:${(c.stars*3)%100}%"></i></div></section>`).join('')}`}
function history(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="dashboard()">←</button><h2>🕘 Historial</h2>${D.history.map(h=>`<section class="card"><b>${D.kids[h.kid].name} · ⭐${h.stars}</b><p>${h.text}</p><small>${h.date}</small></section>`).join('')||'<p>No hay movimientos.</p>'}`}
function notify(){alert(C().pet.name+' dice:\\n\\n'+alertText())}
function showReward(){document.getElementById('rewardText').textContent=D.reward;document.getElementById('reward').classList.add('show')}
function closeReward(){document.getElementById('reward').classList.remove('show')}
home();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
