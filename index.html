<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191a20">
<title>Mis Pequeñas Misiones</title>

<style>
:root{
 --pink:#ec5b89;
 --pink2:#f6a4bc;
 --purple:#7953bd;
 --yellow:#ffd83d;
 --green:#21a789;
 --blue:#56aee8;
 --ink:#403647;
 --muted:#7c747d;
 --bg:#fbf7fb;
 --line:#e9dfe8;
 --card:#fff;
 --soft:#fff2f7;
 --shadow:0 5px 20px rgba(50,30,60,.08)
}

*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 background:#191a20;
 color:var(--ink);
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
 max-width:720px;
 min-height:100vh;
 margin:auto;
 background:linear-gradient(#fffafd,#faf7fb);
 padding-bottom:92px;
 position:relative
}

.topbar{
 height:58px;
 background:#191a20;
 color:white;
 display:flex;
 align-items:center;
 padding:0 18px;
 font-weight:800;
 font-size:18px
}

.header{
 background:#fffafd;
 border-bottom:1px solid var(--line);
 padding:20px 24px 18px;
 display:flex;
 align-items:center;
 justify-content:space-between
}

.brand{
 display:flex;
 align-items:center;
 gap:13px
}

.brand .star{
 font-size:54px;
 line-height:1
}

.brand h1{
 font-size:28px;
 margin:0 0 2px;
 letter-spacing:-.6px
}

.brand p{
 margin:0;
 color:#817985;
 font-size:16px
}

.iconbtn{
 border:0;
 background:white;
 border-radius:22px;
 width:58px;
 height:58px;
 box-shadow:var(--shadow);
 font-size:29px
}

main{padding:16px 18px}

.child-tabs{
 display:flex;
 gap:8px;
 overflow:auto;
 margin:0 0 14px
}

.child-tab{
 border:1px solid var(--line);
 background:#fff;
 border-radius:18px;
 padding:10px 15px;
 min-width:108px;
 font-weight:800;
 color:var(--muted)
}

.child-tab.active{
 background:#fff0f6;
 border:2px solid var(--pink);
 color:var(--pink)
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:25px;
 box-shadow:var(--shadow);
 padding:17px;
 margin:12px 0
}

.profile{
 display:flex;
 gap:16px;
 align-items:center;
 background:linear-gradient(135deg,#fff,#fff1f7);
 padding:19px
}

.avatar{
 width:94px;
 height:94px;
 border-radius:28px;
 background:#eee4ff;
 display:grid;
 place-items:center;
 font-size:59px;
 flex:none
}

.profile h2{
 margin:0;
 font-size:28px
}

.profile .age{
 color:var(--muted);
 font-size:17px;
 margin:2px 0 10px
}

.chips{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.chip{
 background:#fff;
 border:1px solid var(--line);
 border-radius:18px;
 padding:7px 11px;
 font-weight:800;
 font-size:14px
}

.section-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:8px
}

.section-head h2{
 margin:0;
 font-size:23px
}

.outline{
 border:1px solid var(--line);
 background:#fff;
 border-radius:16px;
 padding:11px 16px;
 font-weight:800
}

.banner{
 background:linear-gradient(135deg,#ffe889,#fff3c5);
 border:1px solid #efd66a;
 border-radius:21px;
 padding:14px;
 text-align:center;
 font-weight:900;
 font-size:16px
}

.banner span{
 font-size:29px;
 margin-left:10px
}

.learn-card{
 background:linear-gradient(135deg,#f5edff,#fff)
}

.pill{
 display:inline-block;
 background:#eee5fb;
 color:#6b46a7;
 border-radius:16px;
 padding:6px 10px;
 font-size:12px;
 font-weight:800
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.tile{
 background:#fff;
 border:1px solid var(--line);
 border-radius:19px;
 padding:15px;
 text-align:left
}

.tile .ico{
 font-size:28px
}

.tile strong{
 display:block;
 margin-top:5px
}

.tile small{
 color:var(--muted)
}

.mission{
 display:grid;
 grid-template-columns:52px 1fr 44px;
 gap:12px;
 align-items:center;
 padding:13px 0;
 border-bottom:1px solid #eee
}

.mission:last-child{
 border-bottom:0
}

.mi{
 width:52px;
 height:52px;
 border-radius:18px;
 background:#fff4bd;
 display:grid;
 place-items:center;
 font-size:29px
}

.mission h3{
 margin:0;
 font-size:17px
}

.mission p{
 margin:2px 0 0;
 color:var(--muted);
 font-size:14px
}

.meta{
 color:var(--green);
 font-weight:800;
 font-size:13px;
 margin-top:5px
}

.plus,.check{
 width:43px;
 height:43px;
 border:0;
 border-radius:50%;
 font-weight:900;
 font-size:25px
}

.plus{
 background:#eaf8f4;
 color:var(--green)
}

.check{
 background:#dff6ed;
 color:var(--green)
}

.bottom{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(720px,100%);
 height:82px;
 background:#fff;
 border-top:1px solid var(--line);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 z-index:20
}

.bottom button{
 border:0;
 background:white;
 color:#746d75;
 font-size:12px;
 padding:6px
}

.bottom b{
 display:block;
 font-size:25px;
 margin-bottom:2px
}

.bottom .active{
 color:var(--pink);
 font-weight:900
}

.btn{
 border:0;
 border-radius:15px;
 padding:12px 15px;
 background:var(--pink);
 color:white;
 font-weight:900
}

.btn.purple{background:var(--purple)}
.btn.yellow{background:var(--yellow);color:#654d00}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.dark{background:#34313a}

.full{
 width:100%;
 margin-top:8px
}

/* =========================
   APRENDER
========================= */

.subject-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.subject{
 border:2px solid var(--line);
 border-radius:22px;
 background:#fff;
 padding:18px;
 text-align:left
}

.subject.selected{
 border-color:var(--purple);
 background:#f6f0ff
}

.subject .bigico{
 font-size:38px
}

.subject strong{
 display:block;
 font-size:19px;
 margin-top:5px
}

.subject small{
 color:var(--muted)
}

.question{
 background:#f8f4ff;
 border-radius:22px;
 padding:20px;
 margin-top:14px
}

.question h2{
 margin-top:0
}

.question-answer{
 font-size:22px;
 font-weight:900;
 margin:16px 0
}

.option{
 width:100%;
 border:1px solid var(--line);
 background:#fff;
 border-radius:16px;
 padding:14px;
 margin:7px 0;
 text-align:left;
 font-weight:800
}

.option.correct{
 background:#dff6ed;
 border-color:var(--green);
 color:#087b5f
}

.option.wrong{
 background:#ffe1e9;
 border-color:var(--pink);
 color:#b52e59
}

.feedback{
 padding:12px;
 border-radius:15px;
 margin-top:10px;
 font-weight:800
}

.feedback.good{
 background:#dff6ed;
 color:#087b5f
}

.feedback.bad{
 background:#ffe1e9;
 color:#a52d55
}

.xpbox{
 background:#fff4bd;
 border-radius:18px;
 padding:12px;
 font-weight:900;
 margin-top:12px
}

.listen-row{
 display:flex;
 gap:8px;
 margin:10px 0;
 flex-wrap:wrap
}

.listen-row button{
 flex:1;
 min-width:130px
}

/* =========================
   MASCOTA
========================= */

.pet-card{
 background:linear-gradient(135deg,#ecfaff,#fff)
}

.pet-stage{
 position:relative;
 width:280px;
 height:245px;
 margin:5px auto 8px;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 border-radius:30px;
 background:
   radial-gradient(circle at 20% 25%,#fff 0 4px,transparent 5px),
   radial-gradient(circle at 80% 35%,#fff 0 4px,transparent 5px),
   linear-gradient(180deg,#e9f9ff,#fefcff);
 border:1px solid #dcecf4
}

.pet-body{
 position:absolute;
 font-size:145px;
 line-height:1;
 z-index:1;
 user-select:none;
 transform-origin:center bottom
}

.pet-shadow{
 position:absolute;
 bottom:27px;
 width:105px;
 height:20px;
 border-radius:50%;
 background:rgba(60,50,70,.10);
 z-index:0
}

.pet-accessory{
 position:absolute;
 z-index:3;
 pointer-events:none;
 user-select:none;
 line-height:1
}

.acc-glasses{
 top:91px;
 left:50%;
 transform:translateX(-50%);
 font-size:58px
}

.acc-hat{
 top:5px;
 left:50%;
 transform:translateX(-50%);
 font-size:75px
}

.acc-bow{
 top:48px;
 right:45px;
 font-size:55px
}

.acc-crown{
 top:0;
 left:50%;
 transform:translateX(-50%);
 font-size:62px
}

.acc-scarf{
 bottom:28px;
 left:50%;
 transform:translateX(-50%);
 font-size:63px
}

.acc-butterfly{
 top:25px;
 right:25px;
 font-size:50px
}

.acc-sparkles{
 top:15px;
 left:25px;
 font-size:48px
}

.acc-none{
 display:none
}

/* Animaciones */

.pet-stage.idle .pet-body{
 animation:petIdle 2.4s ease-in-out infinite
}

.pet-stage.jump .pet-body{
 animation:petJump 1s ease-in-out
}

.pet-stage.hop .pet-body{
 animation:petHop 1.1s ease-in-out
}

.pet-stage.fly .pet-body{
 animation:petFly 1.7s ease-in-out
}

.pet-stage.run .pet-body{
 animation:petRun 1.5s ease-in-out
}

.pet-stage.roll .pet-body{
 animation:petRoll 1.5s ease-in-out
}

.pet-stage.walk .pet-body{
 animation:petWalk 2s ease-in-out
}

.pet-stage.play .pet-body{
 animation:petPlay 1.5s ease-in-out
}

@keyframes petIdle{
 0%,100%
